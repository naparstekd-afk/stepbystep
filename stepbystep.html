<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1E3A6E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="stepbystep">
<meta name="app-build" content="b-2026-08-26-z10">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<title>stepbystep — Beth Habad</title>
<style>
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --surface-2:#F9FAFB; --bg-soft:#F9FAFB; --ink:#111827; --ink-soft:#6B7280;
  --line:#E5E7EB; --line-soft:#F1F3F5;
  --primary:#1E3A6E; --primary-soft:#EEF2FB; --primary-ink:#16294E;
  --gold:#AC8438; --gold-soft:#F3EEE1;
  --green:#2E7D55; --green-soft:#E7F3EC; --amber:#B87A1F; --amber-soft:#FBF3E1;
  --red:#C0453F; --red-soft:#FBEAE8; --blue:#2C5B8E; --violet:#6B4E9E;
  --r:14px; --r-sm:10px;
  --sh:0 1px 2px rgba(17,24,39,.04),0 1px 3px rgba(17,24,39,.03);
  --sh-lg:0 12px 44px rgba(17,24,39,.13);
  --serif:'Fraunces','Georgia',serif; --sans:'Inter',system-ui,-apple-system,sans-serif;
}
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;overflow:hidden}
::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
[data-act]{cursor:pointer;-webkit-tap-highlight-color:rgba(30,58,110,.12);touch-action:manipulation}
.drag-handle{cursor:grab;touch-action:none;color:var(--ink-soft);font-size:19px;line-height:1;padding:4px 4px;user-select:none;-webkit-user-select:none;display:flex;align-items:center;flex-shrink:0}
.drag-handle:active{cursor:grabbing}
.drag-row.dragging{touch-action:none}
.task.dragging{opacity:.55;background:var(--primary-soft);border-radius:10px}
.task.dragover-top{box-shadow:inset 0 3px 0 var(--primary)}
.task.dragover-bot{box-shadow:inset 0 -3px 0 var(--primary)}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dp-grid.rtl{direction:rtl}
.mvbox{margin-top:12px;border:1px solid var(--line);border-radius:14px;background:var(--bg-soft,#FAF8F2);padding:12px}
.mvbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mvtitle{font-weight:700;font-size:14px;color:var(--ink)}
.mvcancel{cursor:pointer;color:var(--ink-soft);font-size:12.5px;font-weight:600}
.mvcrumb{font-size:12px;color:var(--primary);font-weight:600;margin-bottom:6px}
.mvstep{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-soft);margin-bottom:10px}
.mvback{cursor:pointer;color:var(--primary);font-weight:700}
.mvnav{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;padding:12px;margin-bottom:7px;cursor:pointer;font-size:13.5px}
.mvdest{background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;padding:11px 12px;margin-bottom:8px}
.mvdest-name{font-size:14px;font-weight:600;color:var(--ink);margin-bottom:8px}
.mvdest-acts{display:flex;gap:8px}
.mvdest-acts .btn{flex:1}
.selbox{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;flex-shrink:0;cursor:pointer}
.selbox.on{background:var(--primary);border-color:var(--primary)}
.task.selrow{background:var(--primary-soft);border-color:#cdd9ee}
.selbar{background:var(--surface);border:1px solid var(--primary);border-radius:12px;padding:10px 12px;margin-bottom:12px;box-shadow:var(--sh)}
.selbar-top{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--ink);margin-bottom:9px}
.sellink{cursor:pointer;color:var(--primary);font-weight:600;font-size:12.5px}
.selbar-acts{display:flex;gap:7px;flex-wrap:wrap}
.selbar-acts .btn{flex:1;min-width:88px}
.dp-wdh{text-align:center;font-size:11px;color:var(--ink-soft);font-weight:600;padding:2px 0}
.dp-day{border:1px solid var(--line-soft);border-radius:8px;padding:5px 2px;text-align:center;cursor:pointer;background:var(--surface)}
.dp-day.sel{background:var(--primary);color:#fff;border-color:var(--primary)}
.dp-day.today{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.agw{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:4px}
.agwh{text-align:center;font-size:11px;color:var(--ink-soft);font-weight:600;padding:2px 0}
.agcell{min-height:52px;border:1px solid var(--line-soft);border-radius:8px;padding:4px 3px;cursor:pointer;background:var(--surface);display:flex;flex-direction:column;align-items:center}
.agcell.today{border-color:var(--primary)}
.agcell.has{background:var(--primary-soft);border-color:#cdd9ee}
.agd{font-size:16px;font-weight:700;color:var(--ink);line-height:1.05;font-family:var(--serif)}
.agds{font-size:9px;color:var(--ink-soft);font-weight:600;line-height:1}
.agn{font-size:10.5px;color:var(--primary);font-weight:700;margin-top:1px}
.agb{font-size:8.5px;color:var(--gold);font-weight:700}
.agcell.first{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.agcell.first .agd{color:var(--gold)}
.agw.rtl{direction:rtl}
/* ---- Calendrier mensuel coloré (agenda unifié) ---- */
.cal-legend{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.cal-legch{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:20px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink)}
.cal-legch.off{opacity:.38}
.cal-legdot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:4px}
.cal-grid.rtl{direction:rtl}
.cal-wh{text-align:center;font-size:11px;color:var(--ink-soft);font-weight:700;padding:3px 0}
.cal-cell{min-height:64px;border:1px solid var(--line-soft);border-radius:8px;padding:4px;cursor:pointer;background:var(--surface);display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cal-cell.today{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.cal-cell.first{box-shadow:inset 0 0 0 1px var(--gold)}
.cal-cell.empty{background:transparent;border:none;cursor:default}
.cal-cell.out{opacity:.4}
.cal-dh{display:flex;justify-content:space-between;align-items:baseline;gap:3px}
.cal-dh .civ{font-size:14px;font-weight:700;font-family:var(--serif);color:var(--ink);line-height:1}
.cal-cell.today .cal-dh .civ{color:var(--primary)}
.cal-cell.first .cal-dh .civ{color:var(--gold)}
.cal-dh .heb{font-size:9px;color:var(--ink-soft);font-weight:600}
.cal-dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:1px}
.cal-dot{width:7px;height:7px;border-radius:50%;background:var(--ink-soft)}
.cal-chip{font-size:10px;line-height:1.25;padding:1px 4px;border-radius:4px;border-left:3px solid var(--ink-soft);background:var(--surface-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;color:var(--ink)}
.cal-chip.done{opacity:.5;text-decoration:line-through}
.cal-more{font-size:9px;color:var(--ink-soft);font-weight:700;padding-left:2px}
.cal-cnt{font-size:10px;color:var(--ink-soft);font-weight:700;margin-top:auto}
body.desktop .app{max-width:880px}
body.desktop .cal-cell{min-height:104px}
body.desktop .cal-chip{font-size:11px;padding:2px 5px}
body.desktop .cal-wh{font-size:12.5px}
.dp-day .dp-g{font-size:14px;font-weight:600;line-height:1.1}
.dp-day .dp-h{font-size:10px;color:var(--ink-soft)}
.dp-day.sel .dp-h{color:#dbe4f2}
input,select,textarea{font-family:inherit;font-size:15px}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:680px;margin:0 auto;background:var(--bg);position:relative}

/* HEADER */
.hdr{background:var(--surface);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;z-index:20}
.hdr-logo{font-family:var(--serif);font-size:21px;font-weight:600;color:var(--primary);letter-spacing:-.4px;display:flex;align-items:center;gap:7px}
.hdr-logo .stars{color:var(--gold);font-size:15px}
.hdr-brand{display:flex;flex-direction:column;line-height:1}
.hdr-brand-sub{font-family:var(--sans);font-size:10.5px;font-weight:600;color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase;margin-top:1px}
.hdr-spacer{flex:1}
.hdr-year{background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line);padding:6px 12px;border-radius:var(--r-sm);font-size:13px;font-weight:600;cursor:pointer}
.hdr-menu-btn{width:40px;height:40px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--primary);transition:.15s}
.hdr-menu-btn:active{background:var(--primary-soft)}

/* BREADCRUMB */
.bc{display:flex;align-items:center;gap:5px;padding:10px 16px 0;font-size:13px;flex-wrap:wrap}
.bc-item{color:var(--ink-soft);cursor:pointer;padding:3px 7px;border-radius:6px;white-space:nowrap;font-weight:500;transition:.12s}
.bc-item:active{background:var(--primary-soft);color:var(--primary)}
.bc-item.active{color:var(--ink);font-weight:600;cursor:default}
.bc-sep{color:var(--line);font-size:11px}

/* MAIN */
.main{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px;-webkit-overflow-scrolling:touch}

/* SECTION HEAD */
.sec{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px;gap:12px}
.sec-eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:3px}
.sec-title{font-family:var(--serif);font-size:25px;font-weight:600;color:var(--ink);letter-spacing:-.5px;line-height:1.1}
.sec-sub{font-size:13px;color:var(--ink-soft);margin-top:4px}

/* BUTTONS */
.btn{padding:9px 15px;border-radius:var(--r-sm);font-size:14px;font-weight:600;transition:.15s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:active{background:var(--primary-ink)}
.btn-soft{background:var(--primary-soft);color:var(--primary)}.btn-soft:active{background:#dde7f5}
.btn-ghost{background:var(--surface);color:var(--ink-soft);border:1px solid var(--line)}.btn-ghost:active{background:var(--surface-2)}
.btn-gold{background:var(--gold);color:#fff}.btn-gold:active{filter:brightness(.94)}
.btn-sm{padding:6px 11px;font-size:13px}
.btn-icon{width:38px;height:38px;padding:0;justify-content:center;border-radius:var(--r-sm)}
.btn-block{width:100%;justify-content:center}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:11px;overflow:hidden;box-shadow:var(--sh);transition:.15s;cursor:pointer}
.card:active{transform:scale(.992);border-color:#d9d0bf}
.card-body{padding:15px 16px;display:flex;align-items:center;gap:13px}
.card-accent{width:4px;align-self:stretch;border-radius:4px;flex-shrink:0}
.card-icon{font-size:23px;flex-shrink:0;line-height:1}
.card-main{flex:1;min-width:0}
.card-name{font-weight:600;font-size:16px;color:var(--ink);letter-spacing:-.2px}
.card-meta{font-size:12.5px;color:var(--ink-soft);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card-side{display:flex;align-items:center;gap:7px;flex-shrink:0}
.pill{padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.pill-budget{background:var(--green-soft);color:var(--green)}
.pill-time{background:var(--gold-soft);color:var(--gold)}
.pill-count{background:var(--primary-soft);color:var(--primary)}
.pill-done{background:var(--green-soft);color:var(--green)}
.pill-mut{background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line-soft)}
.progress{height:5px;background:var(--line-soft);overflow:hidden}
.progress-fill{height:100%;transition:width .4s cubic-bezier(.4,0,.2,1)}
.chev{color:var(--line);font-size:19px;flex-shrink:0}

/* MONTH GRID */
.months{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;grid-auto-rows:98px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 6px;text-align:center;cursor:pointer;transition:.15s;box-shadow:var(--sh);position:relative;overflow:hidden}
.mcard:active{transform:scale(.97)}
.mcard.filled{border-color:#d6ccb8}
.mcard.filled::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--primary),var(--gold))}
.mcard-emoji{font-size:19px;margin-bottom:1px;line-height:1}
.mcard-name{font-weight:600;font-size:13px;color:var(--ink);letter-spacing:-.2px;line-height:1.1}
.mcard-heb{font-size:10.5px;color:var(--ink-soft);margin-top:0;line-height:1.1}
.mcard-count{font-size:10px;color:var(--primary);margin-top:2px;font-weight:600;line-height:1.1}
.mcard-cost{font-size:9.5px;color:var(--gold);font-weight:700;margin-top:1px;line-height:1.1}
.mcard-count.empty{color:#BEB39C}

/* TASK */
.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:9px;overflow:hidden;box-shadow:var(--sh)}
.task-main{display:flex;align-items:flex-start;gap:11px;padding:13px 14px}
.check{width:23px;height:23px;border-radius:7px;border:2px solid var(--line);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;transition:.15s;background:var(--surface)}
.task-content{flex:1;min-width:0;cursor:pointer}
.task-text{font-size:15px;color:var(--ink);line-height:1.4;font-weight:500}
.task-text.done{text-decoration:line-through;color:#A9B2BC;font-weight:400}
.task-tags{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.tag{padding:3px 8px;border-radius:7px;font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.tag-who{background:var(--primary-soft);color:var(--primary)}
.tag-budget{background:var(--green-soft);color:var(--green)}
.tag-time{background:var(--gold-soft);color:var(--gold)}
.tag-qty{background:#FDEEE0;color:#C2691A}
.tag-sub{background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--line-soft)}
/* Carte de tâche COMPACTE pour Ma Journée (avec mini-libellé de rattachement) */
.jtask{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:7px;box-shadow:var(--sh)}
.jtask .check{width:20px;height:20px;margin-top:1px;font-size:12px}
.jtask-body{flex:1;min-width:0;cursor:pointer}
.jtask-title{font-size:14px;font-weight:500;color:var(--ink);line-height:1.3}
.jtask-title.done{text-decoration:line-through;color:var(--ink-soft)}
.jtask-sub{display:flex;align-items:center;gap:5px;margin-top:3px;flex-wrap:wrap}
.jtask-where{font-size:11px;color:var(--ink-soft);font-weight:500;background:var(--surface-2);border:1px solid var(--line-soft);padding:1px 7px;border-radius:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jtask-sub .tag{padding:1px 6px;font-size:10.5px}
/* Barre d'icônes de « Nouvelle tâche » (façon Google Tasks) */
.qt-ic{width:42px;height:42px;border:1px solid var(--line);border-radius:11px;background:var(--surface);font-size:19px;line-height:1;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);flex-shrink:0}
.qt-ic.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.tag-note{background:var(--surface-2);color:var(--ink-soft);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-acts{display:flex;gap:3px;flex-shrink:0}
.mini-btn{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--ink-soft);transition:.12s}
.mini-btn:active{background:var(--surface-2)}
.mini-btn.danger:active{background:var(--red-soft);color:var(--red)}
.subs{padding:0 14px 11px 48px;display:flex;flex-direction:column;gap:0}
.subs-deep{padding-left:14px;border-left:2px solid var(--line-soft);margin:2px 0 2px 4px}
.sub{display:flex;align-items:center;gap:9px;padding:8px 0;border-top:1px solid var(--line-soft)}
.sub-check{width:18px;height:18px;border-radius:5px;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;background:var(--surface);cursor:pointer}
.sub-text{font-size:13.5px;color:var(--ink-soft);flex:1;cursor:pointer}
.sub-text.done{text-decoration:line-through;color:#B8C0C9}

/* FILTER BAR */
.filters{display:flex;gap:7px;margin-bottom:13px;flex-wrap:wrap}
.chip{padding:7px 13px;border-radius:20px;font-size:13px;font-weight:600;background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);transition:.12s}
.chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* PROGRESS HEADER */
.phead{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;margin-bottom:14px;box-shadow:var(--sh)}
.phead-row{display:flex;align-items:center;gap:11px;margin-bottom:9px}
.phead-pct{font-family:var(--serif);font-size:21px;font-weight:600;color:var(--primary)}
.phead-label{font-size:13px;color:var(--ink-soft);flex:1}
.phead-bar{height:7px;background:var(--line-soft);border-radius:5px;overflow:hidden}
.phead-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--primary),var(--blue));transition:width .4s}

/* EMPTY */
.empty{text-align:center;padding:46px 24px;color:var(--ink-soft)}
.empty-icon{font-size:42px;margin-bottom:12px;opacity:.5}
.empty-title{font-family:var(--serif);font-size:18px;color:var(--ink);margin-bottom:5px;font-weight:600}
.empty-text{font-size:14px;margin-bottom:18px}

/* BOTTOM NAV */
.bnav{background:var(--surface);border-top:1px solid var(--line);display:flex;flex-shrink:0;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:var(--r-sm);color:#A9B0B8;font-size:11px;font-weight:600;transition:.15s}
.bnav-btn .ic{font-size:21px;line-height:1}
.bnav-btn.active{color:var(--primary)}
.bnav-btn.active .ic{transform:translateY(-1px)}

/* FAB */
.fab{position:absolute;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:50%;background:var(--primary);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(30,58,110,.28);z-index:15;transition:.15s}
.fab:active{transform:scale(.92)}

/* MODAL / SHEET */
.overlay{position:fixed;inset:0;background:rgba(28,42,58,.45);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--bg);border-radius:22px 22px 0 0;width:100%;max-width:680px;max-height:92vh;overflow-y:auto;animation:slideup .28s cubic-bezier(.16,1,.3,1);box-shadow:var(--sh-lg)}
@keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
/* Pas de ré-animation quand la fiche est déjà ouverte (évite que la page « saute » à chaque bouton). */
.sheet.no-anim,.drawer.no-anim{animation:none!important}
.subedit.collapsed{cursor:pointer}
.sheet-grip{width:38px;height:4px;background:var(--line);border-radius:3px;margin:9px auto 0}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 12px;position:sticky;top:0;background:var(--bg);z-index:5}
.sheet-title{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--ink)}
.sheet-body{padding:0 18px 28px}
.sheet-close{width:34px;height:34px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--ink-soft)}

/* FIELDS */
.field{margin-bottom:16px}
.field-label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);letter-spacing:.04em;margin-bottom:7px;text-transform:uppercase}
.input,.textarea,.select{width:100%;background:var(--surface);border:1.5px solid var(--line);color:var(--ink);padding:11px 13px;border-radius:var(--r-sm);outline:none;transition:.15s}
.input:focus,.textarea:focus,.select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.textarea{resize:vertical;min-height:74px;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.row3{display:grid;grid-template-columns:auto 1fr 1fr;gap:9px;align-items:end}

/* SEGMENTED STATUS */
.statuses{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.st-opt{padding:9px 4px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:4px;justify-content:center;transition:.12s}
.st-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}

/* DURATION CHIPS */
.dur-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.dur-chip{padding:7px 12px;background:var(--surface);border:1.5px solid var(--line);border-radius:20px;font-size:13px;font-weight:600;color:var(--ink-soft);transition:.12s}
.dur-chip.active{background:var(--gold);border-color:var(--gold);color:#fff}

/* RECURRENCE TOGGLE */
.toggle-group{display:flex;gap:8px}
.toggle-opt{flex:1;padding:12px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surface);text-align:center;font-size:14px;font-weight:600;color:var(--ink-soft);transition:.12s}
.toggle-opt.active{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.toggle-opt .sub{display:block;font-size:11px;font-weight:500;color:var(--ink-soft);margin-top:2px}
.dp-rep{background:var(--primary-soft);border-radius:12px;padding:12px;margin-top:6px}
.dp-wd{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer}
.dp-wd.on{background:var(--primary);color:#fff;border-color:var(--primary)}

/* MATERIAL TYPE */
.mat-types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mat-opt{padding:11px 6px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surface);text-align:center;font-size:12.5px;font-weight:600;color:var(--ink-soft);transition:.12s}
.mat-opt .em{font-size:20px;display:block;margin-bottom:4px}
.mat-opt.active{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}

/* SUB-EDIT */
.subedit{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:11px;margin-bottom:9px}
.subedit-head{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.subedit-num{font-size:12px;font-weight:700;color:var(--gold)}
.subedit-grid{display:grid;grid-template-columns:1fr;gap:8px}
.input-sm{padding:8px 10px;font-size:13.5px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);width:100%;outline:none}
.input-sm:focus{border-color:var(--primary)}

/* DEP TAGS */
.deps{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:9px}
.dep{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);padding:5px 10px;border-radius:20px;font-size:12.5px;color:var(--ink-soft)}
.dep-x{color:var(--red);font-weight:700;font-size:14px;cursor:pointer}

/* MENU DRAWER */
.drawer{position:fixed;top:0;right:0;bottom:0;width:84%;max-width:340px;background:var(--surface);z-index:110;box-shadow:var(--sh-lg);animation:slidein .28s cubic-bezier(.16,1,.3,1);display:flex;flex-direction:column}
@keyframes slidein{from{transform:translateX(100%)}to{transform:translateX(0)}}
.drawer-head{padding:20px 20px 16px;border-bottom:1px solid var(--line);background:linear-gradient(135deg,var(--primary),var(--primary-ink));color:#fff}
.drawer-head .stars{color:var(--gold)}
.drawer-title{font-family:var(--serif);font-size:22px;font-weight:600;display:flex;align-items:center;gap:8px}
.drawer-sub{font-size:13px;opacity:.8;margin-top:3px}
.drawer-body{flex:1;overflow-y:auto;padding:12px}
.drawer-sec{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);padding:14px 12px 6px}
.drawer-item{display:flex;align-items:center;gap:13px;padding:13px 12px;border-radius:var(--r-sm);font-size:15px;font-weight:500;color:var(--ink);transition:.12s;width:100%;text-align:left}
.drawer-item:active{background:var(--surface-2)}
.drawer-item .ic{font-size:20px;width:24px;text-align:center}
.drawer-item .badge{margin-left:auto;font-size:10px;font-weight:700;background:var(--gold-soft);color:var(--gold);padding:2px 7px;border-radius:10px;text-transform:uppercase;letter-spacing:.03em}

/* COUNTERS (Journal) */
.counter{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line-soft)}
.counter:last-child{border-bottom:none}
.counter-info{display:flex;align-items:center;gap:11px}
.counter-em{font-size:22px}
.counter-name{font-size:15px;font-weight:500;color:var(--ink)}
.counter-ctrl{display:flex;align-items:center;gap:13px}
.cbtn{width:34px;height:34px;border-radius:50%;background:var(--surface-2);border:1.5px solid var(--line);font-size:20px;color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:600;line-height:1}
.cbtn:active{background:var(--primary-soft)}
.cval{font-family:var(--serif);font-size:23px;font-weight:600;color:var(--ink);min-width:38px;text-align:center}

/* DASHBOARD STATS */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.stat-val{font-family:var(--serif);font-size:30px;font-weight:600;color:var(--primary);line-height:1}
.stat-label{font-size:12.5px;color:var(--ink-soft);margin-top:5px;font-weight:500}
.stat-em{font-size:18px;margin-bottom:8px;display:block}

/* DATE RANGE */
.daterange{display:flex;gap:9px;align-items:end;margin-bottom:14px}

/* TABS */
.tabs{display:flex;gap:5px;background:var(--surface-2);border:1px solid var(--line);padding:4px;border-radius:var(--r-sm);margin-bottom:16px}
.tab{flex:1;padding:9px;text-align:center;border-radius:7px;font-size:13.5px;font-weight:600;color:var(--ink-soft);transition:.12s}
.tab.active{background:var(--surface);color:var(--primary);box-shadow:var(--sh)}

/* SHOPPING */
.shop-store{margin-bottom:18px}
.shop-store-head{display:flex;align-items:center;gap:9px;margin-bottom:9px;padding:0 2px}
.shop-store-name{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--ink)}
.shop-store-count{font-size:12px;color:var(--ink-soft);background:var(--surface-2);padding:2px 9px;border-radius:12px;border:1px solid var(--line-soft)}
.shop-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;margin-bottom:7px;display:flex;align-items:center;gap:11px;box-shadow:var(--sh)}
.shop-item-main{flex:1;min-width:0}
.shop-item-name{font-size:14.5px;font-weight:500;color:var(--ink)}
.shop-item-meta{font-size:12px;color:var(--ink-soft);margin-top:2px}

/* helper */
.hint{font-size:12.5px;color:var(--ink-soft);background:var(--gold-soft);border:1px solid #ECD9B3;border-radius:var(--r-sm);padding:10px 12px;margin-bottom:14px;line-height:1.45}
.hint b{color:var(--gold)}
.divider{height:1px;background:var(--line);margin:18px 0}
.section-label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:18px 0 10px}
.reorder-btns{display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.reorder-btn{width:28px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-soft);background:var(--surface-2);border:1px solid var(--line-soft)}
.reorder-btn:active{background:var(--primary-soft);color:var(--primary)}
.group-title{font-family:var(--serif);font-size:16px;font-weight:600;color:var(--primary);margin:16px 0 9px;display:flex;align-items:center;gap:8px}
.group-title::before{content:'';width:18px;height:2px;background:var(--gold);border-radius:2px}
.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:22px;font-size:13.5px;font-weight:500;z-index:200;box-shadow:var(--sh-lg);animation:fade .2s;max-width:90%;text-align:center}
.tmr-pill{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:10px;background:var(--primary);color:#fff;padding:8px 10px 8px 16px;border-radius:24px;font-size:15px;font-weight:700;z-index:300;box-shadow:var(--sh-lg);cursor:pointer;font-family:var(--serif);letter-spacing:.5px}
.tmr-pill.done{background:var(--red);animation:tmrpulse 1s infinite}
.tmr-pill-x{background:rgba(255,255,255,.25);border:none;color:#fff;width:22px;height:22px;border-radius:50%;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
@keyframes tmrpulse{0%,100%{opacity:1}50%{opacity:.6}}

/* ===== V12 — compact / cohérence ===== */
.hdr-btn{height:40px;padding:0 12px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--primary);transition:.15s}
.hdr-btn:active{background:var(--primary-soft)}
.hdr-icobtn{width:40px;height:40px;border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--primary)}
/* pill dropdown (période, statut, déplacer, exporter) */
.dd{position:relative;display:inline-block}
.dd-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:20px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink);transition:.12s}
.dd-btn:active{background:var(--surface-2)}
.dd-btn.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.dd-menu{position:absolute;z-index:60;top:calc(100% + 5px);left:0;min-width:180px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh-lg);padding:5px;animation:fade .12s}
.dd-menu.right{left:auto;right:0}
.dd-item{display:flex;align-items:center;gap:9px;padding:10px 11px;border-radius:8px;font-size:14px;font-weight:500;color:var(--ink);width:100%;text-align:left;white-space:nowrap}
.dd-item:active{background:var(--surface-2)}
.dd-item.sel{background:var(--primary-soft);color:var(--primary);font-weight:600}
.dd-scrim{position:fixed;inset:0;z-index:55}
/* toggle « prioritaire / thème » */
.tpill{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:20px;border:1.5px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600;color:var(--ink-soft);transition:.12s}
.tpill.on{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.tpill.on.theme{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.tpill .dotmark{width:15px;height:15px;border-radius:5px;border:1.5px solid currentColor;display:inline-flex;align-items:center;justify-content:center;font-size:11px;line-height:1}
.tpill.on .dotmark{background:currentColor}
.tpill.on .dotmark::after{content:'✓';color:#fff}
/* grille de tuiles (Thèmes / BDD) — cohérente avec le calendrier */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 14px;box-shadow:var(--sh);cursor:pointer;transition:.15s;position:relative;overflow:hidden;min-height:96px;display:flex;flex-direction:column;gap:4px}
.tile:active{transform:scale(.98)}
.tile::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--accent,var(--primary))}
.tile-ic{font-size:24px;line-height:1}
.tile-name{font-weight:600;font-size:15.5px;color:var(--ink);letter-spacing:-.2px;line-height:1.15}
.tile-meta{font-size:12px;color:var(--ink-soft);margin-top:auto}
.tile-add{border:1.5px dashed var(--line);background:var(--surface-2);align-items:center;justify-content:center;color:var(--ink-soft);font-weight:600;text-align:center}
.tile-add::before{display:none}
.doss-item{-webkit-user-select:none;user-select:none}
.doss-dragging{opacity:.6;transform:scale(1.03);box-shadow:0 10px 30px rgba(17,24,39,.20);position:relative;z-index:6;transition:transform .08s}
/* sous-tâches repliables dans Ma Journée */
.subrow{display:flex;align-items:flex-start;gap:9px;padding:9px 12px 9px 22px;margin:0 0 0 26px;border-left:2px solid var(--line);background:var(--surface);border-top:1px solid var(--line-soft)}
.subrow .task-text{font-size:13.5px}
.exp-toggle{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--primary);background:var(--primary-soft);padding:3px 9px;border-radius:12px;cursor:pointer}
.wrap-task{margin-bottom:9px}
.wrap-task .task{margin-bottom:0}
</style>

<body>
<div class="app" id="app"></div>
<div id="overlay-root"></div>
<div id="toast-root"></div>
<div id="timer-root"></div>
<script>
/* ============================================================
   MARBITZ V1.1 — Moteur d'organisation du Beth Habad
   ============================================================ */

// ---------- UTILS ----------
const uid = () => Math.random().toString(36).slice(2, 9);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const fmtM = m => { if(!m) return ''; if(m<60) return m+'min'; const h=Math.floor(m/60), r=m%60; return r? h+'h'+String(r).padStart(2,'0') : h+'h'; };
const fmtE = n => n ? Number(n).toLocaleString('fr-FR')+' €' : '';

// Toutes les sous-tâches sont des "items" avec la même forme qu'une tâche (récursif)
function totalDuration(t){
  if(t.subtasks && t.subtasks.length) return t.subtasks.reduce((a,s)=>a+totalDuration(s),0);
  return t.duration||0;
}
function totalBudget(t){
  let b = (t.budget && t.budget.amount) || 0;
  if(t.subtasks) b += t.subtasks.reduce((a,s)=>a+totalBudget(s),0);
  return b;
}
const sumDur = arr => (arr||[]).reduce((a,t)=>a+totalDuration(t),0);
const sumBud = arr => (arr||[]).reduce((a,t)=>a+totalBudget(t),0);
const countDone = arr => (arr||[]).filter(t=>t.status==='done').length;

// ---------- CONSTANTES ----------
const MONTHS = [
  {id:'tishri',name:'Tishri',heb:'תשרי',emoji:'🍎'},{id:'heshvan',name:'Heshvan',heb:'חשון',emoji:'🌧️'},
  {id:'kislev',name:'Kislev',heb:'כסלו',emoji:'🕎'},{id:'tevet',name:'Tevet',heb:'טבת',emoji:'❄️'},
  {id:'shvat',name:'Shvat',heb:'שבט',emoji:'🌱'},{id:'adar',name:'Adar',heb:'אדר',emoji:'🎭'},
  {id:'nissan',name:'Nissan',heb:'ניסן',emoji:'🌸'},{id:'iyar',name:'Iyar',heb:'אייר',emoji:'☀️'},
  {id:'sivan',name:'Sivan',heb:'סיון',emoji:'📜'},{id:'tamuz',name:'Tamuz',heb:'תמוז',emoji:'🌞'},
  {id:'av',name:'Av',heb:'אב',emoji:'🕯️'},{id:'elul',name:'Elul',heb:'אלול',emoji:'🔔'}
];
const THEMES = ['Nourriture','Salle','Personnel','Impression','Décoration','Transport','Divers'];
const STATUSES = [
  {id:'todo',label:'À faire',c:'#A9B0B8'},{id:'inprogress',label:'En cours',c:'#2C5B8E'},
  {id:'done',label:'Fait',c:'#2E7D55'}
];
const MAT = [{id:'buy',em:'🛒',label:'À acheter'},{id:'bring',em:'🏠',label:'À apporter'},{id:'onsite',em:'🏛️',label:'Sur place'}];

const stOf = id => STATUSES.find(s=>s.id===id) || STATUSES[0];
const nextSt = id => { const i=STATUSES.findIndex(s=>s.id===id); return STATUSES[(i+1)%STATUSES.length].id; };

// ---------- FABRIQUES ----------
function mkTask(text=''){
  return {id:uid(),text,responsible:'',status:'todo',duration:5,dependsOn:[],subtasks:[],notes:'',date:'',
    budget:{amount:0,theme:'Divers'},
    material:{type:'buy',note:'',lines:[]},
    recurring:false,reminders:[30],debrief:'',priority:'normale'};   // debrief : note post-événement ; priority : haute/normale/basse
}
// Rendez-vous / invitation : élément daté personnel (mariage, brit…), séparé des tâches à faire.
function mkRdv(text=''){ return {id:uid(),text,type:'rdv',status:'todo',date:'',time:'',place:'',notes:'',reminders:[3],subtasks:[],duration:0,priority:'normale',responsible:'',dependsOn:[],budget:{amount:0,theme:'Divers'},material:{type:'buy',note:'',lines:[]},recurring:false,debrief:''}; }
function mkEvent(name=''){ return {id:uid(),name,date:'',recurring:false,tasks:[],report:'',public:''}; }   // report : compte rendu ; public : audience visée
function mkFete(name='',color='#1E3A6E'){ return {id:uid(),name,color,date:'',recurring:false,events:[]}; }
// Dossier : plan libre (titres + tâches), plaçable partout. items = suite ordonnée de {kind:'title'} et de tâches.
function mkDossier(name=''){ return {id:uid(),type:'dossier',name,items:[],anchor:null,parentId:null,color:null,icon:'🗂️'}; }
function mkTitle(text='',level=1){ return {id:uid(),kind:'title',text,level}; }
function mkProgram(name='',color='#2C5B8E'){ return {id:uid(),name,color,date:'',events:[],sessions:[],animateurs:[],absences:{}}; }

// ---------- ÉTAT ----------
let D = null;
let nav = {view:'journal', monthId:null, feteId:null, eventId:null, ctx:'fete'}; // ctx: fete|program
let jTab = 'tasks';
let taskFilter = 'all';
let drawerOpen = false;
let sheet = null;       // {type, ...}
let editBuf = null;     // buffer d'édition de tâche
let tplBuf=null;        // buffer d'édition de modèle
let moveNav=null;       // explorateur de réattribution {mId,fId,pId}
let _themeAssign=null;  // {themeId,name} — attribution d'une activité de thème à un mois
let datePicker=null;    // sélecteur de date hébraïque
let progYM=null;        // mois affiché dans Présences & Salaires
let progGen=false;      // formulaire de génération de journées
let childFilter='all'; let childDay=null; // présences enfants
let agMode='civil'; let agAnchor=null; // agenda fusionné
let agHidden={}; // thèmes masqués dans le calendrier (filtre par couleur)
let journalDeskMode='cal'; // sur ordinateur : 'cal' (calendrier mensuel) ou 'cards' (Ma journée en liste)
function setJournalDeskMode(m){ journalDeskMode=m; render(); }
let jDay=null; let childBulk=false; let progDates=false; // nav jour + ajout groupé + import dates
let _tmrTotal=0,_tmrLeft=0,_tmrRun=false,_tmrIv=null,_tmrEnd=0,_tmrTaskText='',_tmrDone=false,_tmrAudio=null; // minuteur
let coachMsgs=[];       // historique du chat coach
let lang='fr';          // langue de l'interface (fr/he/en)
let dashRange = 'today';
let journalKey = todayKey();  // jour affiché dans Compte rendu
let groupedView = null; // résultat du tri intelligent {mode, groups}
let jSort = null; // tri intelligent de Ma Journée : null | 'urgency' | 'theme' | 'where'
let jFilter = {tasks:true, events:true, reminders:true}; // Ma Journée : affichage multichoix (tâches / événements / rappels)
let dossLayout = (function(){ try{ return localStorage.getItem('sbs_dosslayout')||'list'; }catch(e){ return 'list'; } })();  // affichage des dossiers : 'list' | 'grid'
let shopRange='all'; // filtre échéance de la liste de courses
let selMode=false; let selSet={}; // sélection multiple de tâches
let jPeriod='today';    // Ma Journée : today | week | civil | heb
let openDD=null;        // menu déroulant ouvert (id)
let expanded={};        // sous-tâches dépliées {taskId:true}
let themeNav=null;      // thème ouvert (id)
let bddNav=null;        // {cat, sub} navigation BDD

// ---------- PERSISTANCE (robuste : fallback mémoire si localStorage bloqué) ----------
let _memStore = {};
let _lsOK = (()=>{ try{ const k='__t'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }catch(e){ return false; } })();
// Clé de stockage local : propre à chaque association une fois connecté,
// sinon l'ancienne clé « marbitz-v11 » (données d'avant le multi-compte).
function _stateKey(){ return (typeof _org!=='undefined' && _org) ? 'sbs_state_'+_org.id : 'marbitz-v11'; }
function save(){
  const key=_stateKey();

// recherche récursive d'une tâche par id dans tout l'arbre
function findTaskAnywhere(tid){
  let res=null;
  const walk=(arr,loc)=>{ for(const t of arr){ if(t.id===tid){res={task:t,loc};return;} if(t.subtasks&&t.subtasks.length) walk(t.subtasks,{...loc,parent:t}); if(res)return; } };
  Object.entries(D.months).forEach(([mId,m])=>{ if(!res && m.tasks)walk(m.tasks,{mId,ctx:'month'}); m.fetes.forEach(f=>{ if(!res && f.tasks)walk(f.tasks,{mId,fId:f.id,ctx:'fete',contTask:true}); f.events.forEach(e=>{ if(!res)walk(e.tasks,{mId,fId:f.id,eId:e.id,ctx:'fete'}); }); }); });
  D.programs.forEach(p=>{ if(!res && p.tasks)walk(p.tasks,{pId:p.id,ctx:'program',contTask:true}); p.events.forEach(e=>{ if(!res)walk(e.tasks,{pId:p.id,eId:e.id,ctx:'program'}); }); });
  if(!res && Array.isArray(D.inbox)) walk(D.inbox,{ctx:'inbox',inbox:true});
  if(!res && Array.isArray(D.rdv)) walk(D.rdv,{ctx:'rdv',rdv:true});
  (D.themes||[]).forEach(th=>{ if(!res && Array.isArray(th.tasks)) walk(th.tasks,{thId:th.id,ctx:'theme',themeTask:true}); (th.events||[]).forEach(e=>{ if(!res) walk(e.tasks||[],{thId:th.id,eId:e.id,ctx:'themeEvent'}); }); });
  (D.dossiers||[]).forEach(d=>{ if(!res && Array.isArray(d.items)) walk(d.items.filter(x=>!x.kind),{doId:d.id,ctx:'dossier',dossier:true}); });
  return res;
}
// Tableau qui CONTIENT directement la tâche (pas ses sous-tâches) désignée par loc.
function taskArrOfLoc(loc){
  if(!loc) return null;
  if(loc.parent) return loc.parent.subtasks;
  if(loc.inbox){ if(!Array.isArray(D.inbox))D.inbox=[]; return D.inbox; }
  if(loc.rdv){ if(!Array.isArray(D.rdv))D.rdv=[]; return D.rdv; }
  if(loc.themeTask||loc.ctx==='theme'){ const th=themeById(loc.thId); if(th){ if(!Array.isArray(th.tasks))th.tasks=[]; return th.tasks; } return null; }
  if(loc.dossier||loc.ctx==='dossier'){ const d=dossierById(loc.doId); if(d){ if(!Array.isArray(d.items))d.items=[]; return d.items; } return null; }
  if(loc.ctx==='month'){ const m=D.months[loc.mId]; if(m){ if(!Array.isArray(m.tasks))m.tasks=[]; return m.tasks; } return null; }
  if(loc.contTask){ if(loc.pId){ const p=D.programs.find(x=>x.id===loc.pId); return p?p.tasks:null; } const m=D.months[loc.mId]; const f=m&&m.fetes.find(x=>x.id===loc.fId); return f?f.tasks:null; }
  const ev=eventOfLoc(loc); return ev?ev.tasks:null;
}

// ---------- RÉCURRENCE ----------
// Réinitialise/duplique les éléments récurrents pour l'année cible.
// Stratégie V1.1 : chaque année a son propre arbre. Si une année n'existe pas encore,
// on clone les éléments récurrents de l'année modèle, statuts remis à zéro.
function ensureRecurring(year){
  // On stocke par année dans D.byYear ; D.months pointe vers l'année courante.
  if(!D.byYear) D.byYear = {};
  if(year===D._activeYear) return;   // déjà sur cette année : ne rien clobbérer
  // Sauver l'état courant dans l'année précédemment active
  if(D._activeYear){
    D.byYear[D._activeYear] = {months:D.months, programs:D.programs, journal:D.journal};
  }
  if(D.byYear[year]){
    const y=D.byYear[year]; D.months=y.months||{}; D.programs=y.programs||[]; D.journal=y.journal||{};
  } else {
    // créer l'année à partir des récurrents de l'année modèle active
    const src = D._activeYear ? (D.byYear[D._activeYear]||{months:{},programs:[]}) : {months:D.months,programs:D.programs};
    D.months = cloneRecurringMonths(src.months);
    D.programs = (src.programs||[]).map(cloneProgramShell);
    D.journal = {};
  }
  // RÉCONCILIATION : une récurrence marquée DANS N'IMPORTE QUELLE année doit se retrouver ici,
  // même si cette année existait déjà (ex. créée vide avant de cocher « récurrent »).
  Object.entries(D.byYear).forEach(([yy,s])=>{ if(yy!==String(year) && s && s.months){ mergeRecurring({months:D.months}, s); } });
  D.byYear[year] = {months:D.months, programs:D.programs, journal:D.journal};  // persister l'année (fusionnée)
  D._activeYear = year;
}
// Fusionne les éléments RÉCURRENTS d'une année source dans l'année cible, sans doublon
// (appariement par nom / libellé), en réinitialisant les cases des éléments ajoutés.
function _findFeteByName(tm, sf){ return (tm.fetes||[]).find(f=> f.name===sf.name && (!!f._monthGeneral)===(!!sf._monthGeneral)); }
function _mergeTasksInto(container, srcTasks){ if(!container.tasks) container.tasks=[]; (srcTasks||[]).forEach(st=>{ if(!container.tasks.some(t=>t.text===st.text)) container.tasks.push(st); }); }
function _mergeEventsInto(tf, rf){ if(!tf.events) tf.events=[]; (rf.events||[]).forEach(re=>{ const te=(tf.events||[]).find(e=>e.name===re.name); if(!te){ tf.events.push(re); } else { _mergeTasksInto(te, re.tasks); } }); _mergeTasksInto(tf, rf.tasks); }
function mergeRecurring(target, source){
  const sm=source.months||{}, tgt=target.months||{};
  Object.entries(sm).forEach(([mId,smonth])=>{
    (smonth.fetes||[]).forEach(sf=>{
      const rf=_clFete(sf); if(!rf) return;   // rien de récurrent dans cette fête
      if(!tgt[mId]) tgt[mId]={fetes:[],tasks:[]};
      if(!tgt[mId].fetes) tgt[mId].fetes=[];
      const tf=_findFeteByName(tgt[mId], sf);
      if(!tf){ tgt[mId].fetes.push(rf); } else { _mergeEventsInto(tf, rf); }
    });
    const rmt=(smonth.tasks||[]).map(t=>_clTask(t,false)).filter(Boolean);
    if(rmt.length){ if(!tgt[mId]) tgt[mId]={fetes:[],tasks:[]}; _mergeTasksInto(tgt[mId], rmt); }
  });
}
function resetStatus(t){ const c={...t,status:'todo'}; if(t.subtasks) c.subtasks=t.subtasks.map(resetStatus); c.id=uid(); return c; }
// --- Propagation annuelle des éléments récurrents ---
// Règle : si un élément (fête / événement / tâche) est marqué « récurrent », lui ET
// tous ses descendants reviennent l'année suivante (au même endroit), cases remises à zéro.
// Un descendant récurrent fait aussi revenir ses parents (comme contenants) pour qu'il ait sa place.
function _clTask(t, inherited){
  if(inherited || t.recurring===true) return resetStatus(t);   // sous-arbre entier, réinitialisé
  const subs=(t.subtasks||[]).map(s=>_clTask(s,false)).filter(Boolean);
  if(subs.length){ return {...t,status:'todo',id:uid(),subtasks:subs}; }
  return null;
}
function _clEvent(e, feteRec){
  if(feteRec || e.recurring===true) return {...e,id:uid(),tasks:(e.tasks||[]).map(t=>resetStatus(t))};
  const tasks=(e.tasks||[]).map(t=>_clTask(t,false)).filter(Boolean);
  if(tasks.length){ return {...e,id:uid(),tasks}; }
  return null;
}
function _clFete(f){
  if(f.recurring===true){
    return {...f,id:uid(),events:(f.events||[]).map(e=>_clEvent(e,true)),tasks:(f.tasks||[]).map(t=>resetStatus(t))};
  }
  const events=(f.events||[]).map(e=>_clEvent(e,false)).filter(Boolean);
  const tasks=(f.tasks||[]).map(t=>_clTask(t,false)).filter(Boolean);
  if(events.length||tasks.length){ return {...f,id:uid(),events,tasks}; }
  return null;
}
function cloneRecurringMonths(months){
  const out={};
  Object.entries(months||{}).forEach(([mId,m])=>{
    const fetes=(m.fetes||[]).map(_clFete).filter(Boolean);
    const tasks=(m.tasks||[]).map(t=>_clTask(t,false)).filter(Boolean);
    if(fetes.length||tasks.length) out[mId]={fetes,tasks};
  });
  return out;
}
function cloneProgramShell(p){
  const rec=p.recurring===true;
  const events=(p.events||[]).map(e=>_clEvent(e,rec)).filter(Boolean);
  const tasks=(p.tasks||[]).map(t=>_clTask(t,rec)).filter(Boolean);
  return {...p,id:uid(),events,tasks,sessions:[],absences:{}};
}

function render(){
  const app=$('app');
  try{ document.body.classList.toggle('desktop', isDesktop()); }catch(e){}
  const _sc=(document.getElementById('main')||{}).scrollTop||0;
  app.innerHTML = headerHTML() + `<div class="main" id="main"></div>` + bottomNavHTML() + fabHTML();
  const main=$('main');
  // Sur ordinateur, « Ma journée » s'affiche en calendrier mensuel coloré ; sur téléphone, en cartes.
  if(nav.view==='journal' && isDesktop() && journalDeskMode==='cal') renderCalGrid(main, true);
  else if(nav.view==='journal') renderJournal(main);
  else if(nav.view==='report') renderReport(main);
  else if(nav.view==='themes'){ nav.view='bdd'; bddNav=null; renderBDD(main); }
  else if(nav.view==='themeEvent') renderEvent(main);
  else if(nav.view==='dossier') renderDossier(main);
  else if(nav.view==='bdd') renderBDD(main);
  else if(nav.view==='calendar'){
    if(!nav.monthId) renderHome(main);
    else if(!nav.feteId) renderMonth(main);
    else if(!nav.eventId) renderFete(main);
    else renderEvent(main);
  }
  else if(nav.view==='programs'){
    if(!nav.feteId) renderProgramsList(main);
    else if(!nav.eventId) renderProgramHome(main);
    else renderEvent(main);
  }
  else if(nav.view==='shopping') renderShopping(main);
  else if(nav.view==='dashboard') renderDashboard(main);
  else if(nav.view==='suppliers') renderSuppliers(main);
  else if(nav.view==='settings') renderSettings(main);
  else if(nav.view==='agenda') renderAgenda(main);
  else if(nav.view==='publics') renderPublics(main);
  else if(nav.view==='tsedaka') renderTsedaka(main);
  else if(nav.view==='annonces') renderAnnonces(main);
  else if(nav.view==='ideas') renderIdeas(main);
  else if(nav.view==='shabbat') renderShabbat(main);
  else if(nav.view==='alltasks') renderAllTasks(main);
  if(main) main.scrollTop=_sc;
  renderOverlay();
}

function breadcrumbHTML(){
  let p=[];
  if(nav.view==='calendar'){
    p.push(['📅 '+t('Calendrier','לוח','Calendar'),'go({monthId:null,feteId:null,eventId:null})']);
    if(nav.monthId){const m=MONTHS.find(x=>x.id===nav.monthId);p.push([`${m.emoji} ${mName(m)}`,`go({feteId:null,eventId:null})`]);}
    if(nav.feteId){const f=curFete();if(f)p.push([f.name,`go({eventId:null})`]);}
    if(nav.eventId){const e=curEvent();if(e)p.push([e.name,null]);}
  } else if(nav.view==='programs'){
    p.push(['📚 Programmes',`go({feteId:null,eventId:null})`]);
    if(nav.feteId){const pr=curProgram();if(pr)p.push([pr.name,`go({eventId:null})`]);}
    if(nav.eventId){const e=curEvent();if(e)p.push([e.name,null]);}
  } else if(nav.view==='themeEvent'){
    const th=themeById(nav.themeId); const e=curEvent();
    p.push(['🎯 Thèmes','leaveThemeEventToList()']);
    if(th)p.push([(th.icon||'🎯')+' '+(th.name||'Thème'),'leaveThemeEvent()']);
    if(e)p.push([e.name,null]);
  } else return '';
  if(p.length<=1 && nav.view!=='programs' && nav.view!=='calendar') return '';
  return `<div class="bc">`+p.map((x,i)=>{
    const last=i===p.length-1;
    const click=x[1]&&!last?`data-act="${x[1]};render()"`:'';
    return (i>0?`<span class="bc-sep">▸</span>`:'')+`<span class="bc-item ${last?'active':''}" ${click}>${esc(x[0])}</span>`;
  }).join('')+`</div>`;
}

function mName(m){ if(!m)return ''; return lang==='he'?(m.heb||m.name):m.name; }   // nom du mois : hébreu si l'app est en hébreu
function setLang(l){ lang=l; if(D)D._lang=l; document.documentElement.lang=l; document.documentElement.dir=(l==='he'?'rtl':'ltr'); save(); render(); }

function renderHome(c){
  let html=`<div class="sec"><div><div class="sec-eyebrow">${t('Année','שנה','Year')} ${D.year}</div><div class="sec-title">${t('Calendrier hébraïque','לוח עברי','Hebrew Calendar')}</div></div></div>`;
  html+=`<div class="months">`;
  MONTHS.forEach(m=>{
    const md=D.months[m.id];
    let tot=0,dn=0,bud=0,remMin=0;
    if(md) md.fetes.forEach(f=>f.events.forEach(e=>{tot+=countAll(e.tasks);dn+=countAllDone(e.tasks);bud+=sumBud(e.tasks);remMin+=sumRemDur(e.tasks);}));
    if(md&&md.tasks){tot+=countAll(md.tasks);dn+=countAllDone(md.tasks);bud+=sumBud(md.tasks);remMin+=sumRemDur(md.tasks);}
    programsInMonth(m.id).forEach(p=>{ bud+=programCost(p); remMin+=programRem(p); });
    const filled=md&&md.fetes.length;
    html+=`<div class="mcard ${filled?'filled':''}" data-act="go({monthId:'${m.id}',feteId:null,eventId:null})">
      <div class="mcard-emoji">${m.emoji}</div>
      <div class="mcard-name">${lang==='he'?m.heb:m.name}</div>
      ${lang==='he'?'':`<div class="mcard-heb">${m.heb}</div>`}
      <div class="mcard-count ${tot?'':'empty'}">${tot? dn+'/'+tot:'—'}</div>
      ${tot?`<div class="mcard-cost">${fmtE(bud)}${remMin?' · '+fmtM(remMin):''}</div>`:''}
    </div>`;
  });
  html+=`</div>`;
  c.innerHTML=html;
}
// Progression = uniquement les tâches « feuilles ». Une tâche qui a des sous-tâches
// est un TITRE (case générale) : elle ne compte pas pour elle-même, seules ses feuilles comptent.
function countAll(tasks){ let n=0; (tasks||[]).forEach(t=>{ if(t.subtasks&&t.subtasks.length) n+=countAll(t.subtasks); else n++; }); return n; }
function countAllDone(tasks){ let n=0; (tasks||[]).forEach(t=>{ if(t.subtasks&&t.subtasks.length) n+=countAllDone(t.subtasks); else if(t.status==='done')n++; }); return n; }
// Toutes les feuilles sous t sont-elles cochées ?
function _leafAllDone(t){ if(t.subtasks&&t.subtasks.length) return t.subtasks.every(_leafAllDone); return t.status==='done'; }
// Coche / décoche t et toute sa descendance.
function _setDone(t,done){ if(t.subtasks&&t.subtasks.length) t.subtasks.forEach(s=>_setDone(s,done)); t.status=done?'done':'todo'; }
// Recalcule le statut « dérivé » des tâches parentes (bas → haut) : parent = fait ssi toutes ses feuilles sont faites.
function _normTasks(arr){ (arr||[]).forEach(t=>{ if(t.subtasks&&t.subtasks.length){ _normTasks(t.subtasks); const all=t.subtasks.every(s=>s.status==='done'); t.status = all ? 'done' : (t.status==='done'?'todo':t.status); } }); }
function normalizeAllTasks(){
  Object.values(D.months||{}).forEach(m=>{ if(m.tasks)_normTasks(m.tasks); (m.fetes||[]).forEach(f=>{ if(f.tasks)_normTasks(f.tasks); (f.events||[]).forEach(e=>{ if(e.tasks)_normTasks(e.tasks); }); }); });
  (D.programs||[]).forEach(p=>{ if(p.tasks)_normTasks(p.tasks); (p.events||[]).forEach(e=>{ if(e.tasks)_normTasks(e.tasks); }); });
  if(Array.isArray(D.inbox)) _normTasks(D.inbox);
  (D.themes||[]).forEach(th=>{ if(Array.isArray(th.tasks)) _normTasks(th.tasks); });
  (D.dossiers||[]).forEach(d=>{ if(Array.isArray(d.items)) _normTasks(d.items.filter(x=>!x.kind)); });
}
function remainingDur(t){ if(t.subtasks&&t.subtasks.length) return t.subtasks.reduce((a,s)=>a+remainingDur(s),0); return t.status==='done'?0:(t.duration||0); }
const sumRemDur = arr => (arr||[]).reduce((a,t)=>a+remainingDur(t),0);
function programCost(p){ return (p.events||[]).reduce((a,e)=>a+sumBud(e.tasks),0); }
function programRem(p){ return (p.events||[]).reduce((a,e)=>a+sumRemDur(e.tasks),0); }
function hebMonthIdOf(iso){
  if(!iso) return null;
  try{
    const parts=new Intl.DateTimeFormat('en-u-ca-hebrew',{month:'long'}).formatToParts(new Date(iso+'T12:00:00'));
    let nm=((parts.find(p=>p.type==='month')||{}).value||'').toLowerCase().replace(/[\s.]/g,'');
    const map={tishri:'tishri',heshvan:'heshvan',cheshvan:'heshvan',marcheshvan:'heshvan',kislev:'kislev',tevet:'tevet',shevat:'shvat',shvat:'shvat',adar:'adar',adari:'adar',adarii:'adar',nisan:'nissan',nissan:'nissan',iyar:'iyar',iyyar:'iyar',sivan:'sivan',tamuz:'tamuz',tammuz:'tamuz',av:'av',elul:'elul'};
    return map[nm]||null;
  }catch(e){ return null; }
}
function programsInMonth(mId){ return (D.programs||[]).filter(p=>p.date && hebMonthIdOf(p.date)===mId); }

function renderMonth(c){
  const m=MONTHS.find(x=>x.id===nav.monthId);
  const md=D.months[nav.monthId];
  const realFetes = md ? md.fetes.filter(f=>!f._monthGeneral) : [];
  // Pas de rappel du nom du mois au-dessus du titre : il est déjà dans le fil d'Ariane.
  let html=`<div class="sec"><div><div class="sec-title">${t('Fêtes & événements','חגים ואירועים','Holidays & events')}</div>`;
  if(realFetes.length){
    const tb=realFetes.reduce((a,f)=>a+f.events.reduce((b,e)=>b+sumBud(e.tasks),0),0);
    html+=`<div class="sec-sub">${nFetes(realFetes.length)}${tb?' · '+fmtE(tb):''}</div>`;
  }
  html+=`</div></div>`;
  if(!realFetes.length){
    html+=emptyHTML(m.emoji,t('Aucune fête ce mois','אין חגים בחודש זה','No holiday this month'),t('Ajoute une fête (bouton + en bas), ou un événement libre ci-dessous.','הוסף חג (כפתור + למטה), או אירוע חופשי למטה.','Add a holiday (+ button below), or a free event below.'),'','');
  } else {
    sortByDate(realFetes).forEach(f=>{
      const all=f.events.reduce((a,e)=>a.concat(e.tasks),[]).concat(f.tasks||[]);
      const tot=countAll(all),dn=countAllDone(all),pct=tot?Math.round(dn/tot*100):0;
      const bud=sumBud(all),dur=sumDur(all);
      html+=`<div class="card drag-row" data-dragid="${f.id}" data-dragkind="fete" data-act="go({feteId:'${f.id}',eventId:null,ctx:'fete'})">
        <div class="card-body">
          <div class="drag-handle" data-drag="${f.id}" data-act="event.stopPropagation()" style="padding:0 2px">⠿</div>
          <div class="card-accent" style="background:${f.color}"></div>
          <div class="card-main">
            <div class="card-name">${esc(f.name)} ${f.recurring?'<span style="color:var(--gold);font-size:13px" title="'+t('Récurrent','חוזר','Recurring')+'">↻</span>':''}</div>
            <div class="card-meta">
              <span>${nEvents(f.events.length)}</span>
              ${bud?`<span class="pill pill-budget">${fmtE(bud)}</span>`:''}
              ${dur?`<span class="pill pill-time">${fmtM(dur)}</span>`:''}
            </div>
          </div>
          <div class="card-side"><span class="pill ${pct===100?'pill-done':'pill-count'}">${dn}/${tot}</span><button class="mini-btn danger" data-act="delFeteById('${f.id}')">🗑</button></div>
        </div>
        <div class="progress"><div class="progress-fill" style="width:${pct}%;background:${f.color}"></div></div>
      </div>`;
    });
  }
  // — Événements libres du mois (rattachés à aucune fête) —
  const _mg = md ? md.fetes.find(f=>f._monthGeneral) : null;
  const _free = (_mg&&_mg.events)||[];
  // Événements hors fête : n'afficher la section (titre + cartes + bouton) QUE s'il y en a.
  // Rien du tout quand il n'y en a pas — on ajoute via le bouton + en bas à droite.
  if(_free.length){
    html+=`<div class="section-label" style="margin-top:16px">📌 ${t('Événements','אירועים','Events')} (${_free.length}) <span style="font-weight:400;color:var(--ink-soft);text-transform:none">— ${t('hors fête','ללא חג','no holiday')}</span></div>`;
    sortByDate(_free).forEach(e=>{
      const tot=countAll(e.tasks),dn=countAllDone(e.tasks),pct=tot?Math.round(dn/tot*100):0;
      html+=`<div class="card drag-row" data-dragid="${e.id}" data-dragkind="event" data-act="go({feteId:'${_mg.id}',eventId:'${e.id}',ctx:'fete'})">
        <div class="card-body">
          <div class="card-icon">📌</div>
          <div class="card-main"><div class="card-name">${esc(e.name)}</div>
            <div class="card-meta">${e.date?'<span>📅 '+fmtDate(e.date)+'</span>':'<span>'+t('sans date','ללא תאריך','no date')+'</span>'}${tot?' <span>· '+nTaches(tot)+'</span>':''}</div></div>
          <div class="card-side"><span class="pill ${pct===100&&tot?'pill-done':'pill-count'}">${tot?dn+'/'+tot:''}</span><button class="mini-btn danger" data-act="event.stopPropagation();delEventInMonth('${e.id}')" title="${t('Supprimer','מחק','Delete')}">🗑</button></div>
        </div>
      </div>`;
    });
    html+=`<button class="btn btn-soft btn-sm btn-block" style="margin-bottom:6px" data-act="qaEventInMonthNamed()">＋ ${t('Ajouter un événement','הוסף אירוע','Add an event')}</button>`;
  }
  const mtasks=(md&&md.tasks)||[];
  if(mtasks.length){ html+=`<div class="section-label" style="margin-top:14px">✅ ${t('Tâches du mois','משימות החודש','Month tasks')}</div>`; mtasks.forEach((t,i)=>html+=taskHTML(t,null,i,mtasks.length,false)); }
  const mdoss=dossiersFor('month',nav.monthId);
  if(mdoss.length){ html+=`<div class="section-label" style="margin-top:14px;display:flex;justify-content:space-between;align-items:center"><span>🗂️ Dossiers</span>${dossLayoutToggleHTML()}</div>`; html+=dossierListHTML(mdoss,'month:'+nav.monthId); }
  html+=`<button class="btn btn-ghost btn-sm btn-block" style="margin-top:8px" data-act="newDossier({kind:'month',id:'${nav.monthId}'})">＋ ${t('Nouveau dossier','תיקייה חדשה','New folder')}</button>`;
  c.innerHTML=html;
}

// ============================================================
//  VUE : FÊTE / PROGRAMME (liste des événements)
// ============================================================
function renderFete(c){
  const f=curFete();
  if(!f){c.innerHTML=emptyHTML('🤔','Introuvable','','← Retour','go({feteId:null})');return;}
  renderContainerEvents(c,f,'fete');
}
function renderProgramHome(c){
  const p=curProgram();
  if(!p){c.innerHTML=emptyHTML('🤔','Introuvable','','← Retour','go({feteId:null})');return;}
  renderContainerEvents(c,p,'program');
}
function renderContainerEvents(c,cont,ctx){
  let html=`<div class="sec"><div><div class="sec-eyebrow">${ctx==='program'?t('Programme','תוכנית','Program'):t('Fête','חג','Holiday')}</div><div class="sec-title"><span data-act="renameContainer()" style="cursor:pointer">${esc(cont.name)}</span></div><div class="sec-sub">${nEvents(cont.events.length)}</div></div>
    </div>`;
  html+=`<div style="margin-bottom:10px">${cont.date?`<span data-act="openDatePicker('fete')" style="display:inline-flex;align-items:center;gap:6px;background:var(--primary-soft);color:var(--primary-ink);padding:6px 12px;border-radius:20px;font-size:13px;cursor:pointer">📅 ${civilDate(cont.date)} · 🕎 ${hebrewDate(cont.date)}</span>`:`<button class="cbtn" data-act="openDatePicker('fete')" title="${t('Ajouter une date','הוסף תאריך','Add a date')}">🗓</button>`}</div>`;
  // (Récurrence de la fête : déplacée en bas, en bouton-icône 🔁)
  if(ctx==='program'){
    html+=`<div class="filters"><button class="chip" data-act="go({view:'programs'})" style="display:none"></button></div>`;
    // quick access to attendance/salaries
    html+=`<div class="card" data-act="openProgramTools('${cont.id}')" style="cursor:pointer"><div class="card-body">
      <div class="card-icon">📊</div><div class="card-main"><div class="card-name">Présences & Salaires</div>
      <div class="card-meta">${cont.sessions.length} journée(s) · ${cont.animateurs.length} animateur(s)</div></div><span class="chev">›</span></div></div>`;
    html+=`<div class="card" data-act="openChildren('${cont.id}')" style="cursor:pointer"><div class="card-body">
      <div class="card-icon">🧒</div><div class="card-main"><div class="card-name">Enfants & présences</div>
      <div class="card-meta">${(cont.participants||[]).length} enfant(s)</div></div><span class="chev">›</span></div></div>`;
  }
  if(!cont.events.length){
    // Pas d'événement : rien n'est affiché ici (ajout via le bouton + en bas à droite).
  } else {
    sortByDate(cont.events).forEach(e=>{
      const tot=countAll(e.tasks),dn=countAllDone(e.tasks),pct=tot?Math.round(dn/tot*100):0;
      const bud=sumBud(e.tasks),dur=sumDur(e.tasks);
      const col=cont.color||'#1E3A6E';
      html+=`<div class="card drag-row" data-dragid="${e.id}" data-dragkind="event" data-act="go({eventId:'${e.id}'})">
        <div class="card-body">
          <div class="drag-handle" data-drag="${e.id}" data-act="event.stopPropagation()" style="padding:0 2px">⠿</div>
          <div class="card-icon">📌</div>
          <div class="card-main"><div class="card-name">${esc(e.name)} ${e.recurring?'<span style="color:var(--gold);font-size:13px">↻</span>':''}</div>
            <div class="card-meta"><span>${nTaches(tot)}</span>
              ${bud?`<span class="pill pill-budget">${fmtE(bud)}</span>`:''}
              ${dur?`<span class="pill pill-time">${fmtM(dur)}</span>`:''}</div>
          </div>
          <div class="card-side"><span class="pill ${pct===100?'pill-done':'pill-count'}">${dn}/${tot}</span><button class="mini-btn danger" data-act="event.stopPropagation();delEventById('${e.id}')" title="${t("Supprimer l'événement",'מחק אירוע','Delete event')}">🗑</button></div>
        </div>
        <div class="progress"><div class="progress-fill" style="width:${pct}%;background:${col}"></div></div>
      </div>`;
    });
  }
  const _ctasks=(cont.tasks||[]);
  if(ctx==='program'){
    html+=`<div class="section-label" style="margin-top:16px">✅ Tâches directes${_ctasks.length?' ('+_ctasks.length+')':''}</div>`;
    if(_ctasks.length){ _ctasks.forEach((t,i)=>html+=taskHTML(t,null,i,_ctasks.length,false)); }
    else html+=`<div class="hint" style="margin-bottom:6px">Aucune tâche directe.</div>`;
    html+=`<button class="btn btn-soft btn-sm btn-block" style="margin-bottom:16px" data-act="qaTaskInContainer()">＋ Nouvelle tâche dans ce programme</button>`;
  } else if(_ctasks.length){
    // Fête : on n'affiche les tâches directes que si elles existent déjà (pas de bouton d'ajout, sur demande).
    html+=`<div class="section-label" style="margin-top:16px">✅ Tâches directes (${_ctasks.length})</div>`;
    _ctasks.forEach((t,i)=>html+=taskHTML(t,null,i,_ctasks.length,false));
  }
  // Récurrence (fête) — un simple rond dont l'icône EST l'état : 1️⃣ = unique, 🔁 = chaque année.
  // Aucun texte à côté. Clic → liste déroulante ; le choix change l'icône du rond.
  if(ctx==='fete'){
    html+=`<div style="margin-top:16px">
      <span class="dd" style="position:relative">
        <button class="cbtn" data-act="toggleDD('feterec')" title="Récurrence : ${cont.recurring?'chaque année':'unique'}" style="${cont.recurring?'background:var(--gold-soft);border-color:var(--gold)':''}">${cont.recurring?'🔁':'1️⃣'}</button>
        ${openDD==='feterec'?`<div class="dd-menu"><button class="dd-item ${!cont.recurring?'sel':''}" data-act="setContainerRecurring(false);closeDD()">1️⃣ Fête unique</button><button class="dd-item ${cont.recurring?'sel':''}" data-act="setContainerRecurring(true);closeDD()">🔁 Chaque année</button></div>`:''}
      </span>
    </div>`;
  }
  // Exporter/Importer + Supprimer — côte à côte (compact)
  html+=`<div style="display:flex;gap:8px;margin-top:12px">
    <button class="btn btn-ghost btn-sm" style="flex:1" data-act="openExport('${ctx==='program'?'program':'fete'}')">⬇ Exporter / ⬆ Importer</button>
    <button class="btn btn-ghost btn-sm" style="color:var(--red)" data-act="delCurrentContainer()" title="Supprimer">🗑 Supprimer</button>
  </div>`;
  c.innerHTML=html;
}
function emptyHTML(icon,title,text,btn,action){
  return `<div class="empty"><div class="empty-icon">${icon}</div><div class="empty-title">${title}</div>
    <div class="empty-text">${text}</div>${btn?`<button class="btn btn-primary" data-act="${action}">${btn}</button>`:''}</div>`;
}

// ============================================================
//  VUE : ÉVÉNEMENT (les tâches) — avec tri, filtres, réordonnancement
// ============================================================
function renderEvent(c){
  const ev=curEvent();
  const cont=curContainer();
  if(!ev){c.innerHTML=emptyHTML('🤔','Événement introuvable','','← Retour','go({eventId:null})');return;}
  const col=cont.color||'#1E3A6E';
  const tasks=ev.tasks;
  const tot=countAll(tasks),dn=countAllDone(tasks),pct=tot?Math.round(dn/tot*100):0;
  const bud=sumBud(tasks),dur=sumDur(tasks);

  let html=`<div class="sec"><div><div class="sec-eyebrow">Événement</div><div class="sec-title"><span data-act="renameEvent()" style="cursor:pointer">${esc(ev.name)}</span></div>
    <div class="sec-sub">${dn}/${tot} fait${bud?' · '+fmtE(bud):''}${dur?' · '+fmtM(dur):''}</div></div></div>`;
  const hasDeb=!!(ev.report)||flattenTasks(ev.tasks).some(t=>t.debrief);
  const evTh=(ev.dossierId||ev.themeId)?dossierById(ev.dossierId||ev.themeId):null;
  // En-tête compact : tout en icônes rondes ; chaque icône ouvre son menu / son sélecteur.
  html+=`<div style="margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    ${ev.date
      ? `<span data-act="openDatePicker('event')" style="display:inline-flex;align-items:center;gap:6px;background:var(--primary-soft);color:var(--primary-ink);padding:7px 12px;border-radius:20px;font-size:13px;cursor:pointer">🗓 ${civilDate(ev.date)} · ${hebrewDate(ev.date)}</span>`
      : `<button class="cbtn" data-act="openDatePicker('event')" title="Ajouter une date / heure">🗓</button>`}
    <button class="cbtn" data-act="openDebrief()" title="Débrief" style="position:relative">📝${hasDeb?`<span style="position:absolute;top:-3px;right:-3px;color:var(--green);font-size:12px">✓</span>`:''}</button>
    <span class="dd" style="position:relative">
      <button class="cbtn" data-act="toggleDD('evtheme')" title="Dossier${evTh?' : '+esc(evTh.name):''}" style="${evTh?'background:'+(evTh.color||'#1E3A6E')+';color:#fff;border-color:'+(evTh.color||'#1E3A6E'):''}">🗂️</button>
      ${openDD==='evtheme'?`<div class="dd-menu" style="max-height:280px;overflow:auto">${(D.dossiers||[]).filter(dd=>!dd.parentId).map(dd=>`<button class="dd-item ${(ev.dossierId||ev.themeId)===dd.id?'sel':''}" data-act="eventLinkTheme('${dd.id}')">${dd.icon||'🗂️'} ${esc(dd.name||'Sans nom')}</button>`).join('')}<button class="dd-item" data-act="eventLinkTheme('__new')">＋ Nouveau dossier…</button>${evTh?`<button class="dd-item" style="color:var(--red)" data-act="eventThemeToggle()">✕ Détacher</button>`:''}</div>`:''}
    </span>
    <span class="dd" style="position:relative">
      <button class="cbtn" data-act="toggleDD('evpublic')" title="Public${ev.public?' : '+esc(ev.public):''}" style="${ev.public?'background:var(--primary-soft);color:var(--primary);border-color:var(--primary)':''}">👥</button>
      ${openDD==='evpublic'?`<div class="dd-menu">${(D.publics||[]).map((p,i)=>`<button class="dd-item ${ev.public===p?'sel':''}" data-act="setEventPublicI(${i})">${esc(p)}</button>`).join('')}${(D.publics||[]).length?'':`<div style="padding:8px 12px;font-size:12px;color:var(--ink-soft)">Aucun public défini</div>`}<button class="dd-item" data-act="setEventPublic('__new')">＋ Nouveau public…</button>${ev.public?`<button class="dd-item" style="color:var(--red)" data-act="setEventPublic('')">✕ Retirer</button>`:''}<button class="dd-item" data-act="openPublics()">⚙️ Gérer les publics</button></div>`:''}
    </span>
    ${ev.public?`<span style="font-size:12.5px;color:var(--primary);font-weight:600">${esc(ev.public)}</span>`:''}
  </div>`;

  // Description propre à l'événement — repliée tant qu'elle est vide (gain de place).
  html+=`${(ev.desc&&ev.desc.trim())||ev._showDesc
    ? `<div class="field" style="margin-bottom:12px"><textarea class="textarea" style="min-height:44px" placeholder="Description de l'événement…" onchange="setEventDesc(this.value)">${esc(ev.desc||'')}</textarea></div>`
    : `<button class="btn btn-ghost btn-sm" style="margin-bottom:12px" data-act="evShowDesc()">＋ Description</button>`}`;

  if(tot){
    html+=`<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
      <div style="flex:1;height:6px;background:var(--line-soft);border-radius:5px;overflow:hidden"><div style="height:100%;width:${pct}%;border-radius:5px;background:linear-gradient(90deg,var(--primary),var(--blue))"></div></div>
      <span style="font-size:13px;font-weight:700;color:var(--primary);white-space:nowrap">${pct}%</span>
      <button class="btn btn-soft btn-sm" data-act="openSmartSort()" title="Tri intelligent">✨ Trier</button>
    </div>`;
    // Sélection : plus de bouton — appui long (~0,6 s) sur une tâche pour l'activer.
    if(selMode){
      const n=Object.keys(selSet).filter(k=>selSet[k]).length;
      html+=`<div class="selbar">
        <div class="selbar-top"><span><b>${n}</b> sélectionnée(s)</span>
          <span style="display:flex;gap:12px;align-items:center"><span class="sellink" data-act="selAllEvent()">Tout</span><span class="sellink" data-act="selClear()">Aucune</span><span class="sellink" data-act="selStop()" style="font-size:16px">✕</span></span></div>
        <div class="selbar-acts">
          <button class="btn btn-soft btn-sm" data-act="bulkStatus('done')">✓ Fait</button>
          <button class="btn btn-soft btn-sm" data-act="bulkStatus('todo')">↺ À faire</button>
          <button class="btn btn-soft btn-sm" data-act="bulkMoveOpen()">↗ Déplacer</button>
          <button class="btn btn-soft btn-sm" style="color:var(--red)" data-act="bulkDelete()">🗑</button>
        </div>
      </div>`;
    }
    if(groupedView){
      html+=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <span class="pill pill-mut">✨ Trié par ${groupedView.mode==='theme'?'thème':'priorité'}</span>
        <button class="btn btn-ghost btn-sm" data-act="clearGroup()">✕ Affichage normal</button></div>`;
      groupedView.groups.forEach(g=>{
        html+=`<div class="group-title">${esc(g.title)}</div>`;
        g.items.forEach((t,i)=>html+=taskHTML(t,ev,i,g.items.length,false));
      });
    } else {
      const list=sortByDeps(tasks);
      list.forEach((t,i)=>html+=taskHTML(t,ev,i,list.length,true));
    }
  }

  // Bas de page : déplacer / dupliquer (y compris vers un autre MOIS), récurrence, export, suppression.
  html+=`<div class="divider"></div><div class="card" style="padding:10px 12px;margin-bottom:10px"><div style="font-size:12px;color:var(--ink-soft);margin-bottom:6px">Déplacer cet événement vers un mois ou une fête…</div>
    <div style="display:flex;gap:7px;flex-wrap:wrap">
      <select class="select" style="flex:1;min-width:140px" onchange="evMoveTo(this.value);this.value=''"><option value="">↗ Déplacer vers…</option>${listFeteDests().map(d=>`<option value="${d.v}">${esc(d.label)}</option>`).join('')}</select>
    </div></div>`;
  // Récurrence : même rond-icône que la fête (1️⃣ unique / 🔁 chaque année), sans texte à côté.
  html+=`<div style="margin-bottom:12px">
    <span class="dd" style="position:relative">
      <button class="cbtn" data-act="toggleDD('evrec')" title="Récurrence : ${ev.recurring?'chaque année':'unique'}" style="${ev.recurring?'background:var(--gold-soft);border-color:var(--gold)':''}">${ev.recurring?'🔁':'1️⃣'}</button>
      ${openDD==='evrec'?`<div class="dd-menu"><button class="dd-item ${!ev.recurring?'sel':''}" data-act="setEventRecurring(false);closeDD()">1️⃣ Événement unique</button><button class="dd-item ${ev.recurring?'sel':''}" data-act="setEventRecurring(true);closeDD()">🔁 Chaque année</button></div>`:''}
    </span>
  </div>`;
  html+=`<div style="display:flex;gap:8px;margin-top:6px"><button class="btn btn-ghost btn-sm" style="flex:1" data-act="openExport('event')">⬇ Exporter / Importer</button><button class="btn btn-ghost btn-sm" style="color:var(--red)" data-act="delCurrentEvent()" title="Supprimer cet événement">🗑 Supprimer</button></div>`;
  c.innerHTML=html;
}

// ---------- DÉBRIEF D'ÉVÉNEMENT (note par moment/tâche + compte rendu général) ----------
function openDebrief(){ sheet={type:'debrief'}; renderOverlay(); }
function debriefSheet(){
  const ev=curEvent();
  if(!ev) return `<div class="sheet-head"><div class="sheet-title">📝 Débrief</div><button class="sheet-close" data-act="closeSheet()">✕</button></div><div class="sheet-body"><div class="hint">Événement introuvable.</div></div>`;
  let h=`<div class="sheet-head"><div class="sheet-title">📝 Débrief — ${esc(ev.name)}</div><button class="sheet-close" data-act="dbClose()">✕</button></div><div class="sheet-body">`;
  h+=`<div class="hint" style="margin-bottom:12px">Pour chaque moment de l'événement : ce qui était bien 👍, pas bien 👎, à améliorer 💡.</div>`;
  if(ev.tasks.length){
    ev.tasks.forEach(t=>{
      h+=`<div class="field"><label class="field-label">${t.status==='done'?'✅ ':''}${esc(t.text)}</label>
        <textarea class="textarea db-task" data-tid="${t.id}" placeholder="👍 bien · 👎 pas bien · 💡 à améliorer" style="min-height:54px">${esc(t.debrief||'')}</textarea></div>`;
    });
  } else {
    h+=`<div class="hint" style="margin-bottom:12px">Aucune tâche dans cet événement.</div>`;
  }
  h+=`<div class="divider"></div>
    <div class="field"><label class="field-label">🗒️ Compte rendu général de l'événement</label>
    <textarea class="textarea" id="db-report" placeholder="Bilan global : déroulé, ambiance, participation, leçons pour la prochaine fois…" style="min-height:110px">${esc(ev.report||'')}</textarea></div>
    <button class="btn btn-primary btn-block" data-act="dbSave()">💾 Enregistrer le débrief</button>
  </div>`;
  return h;
}
function dbSync(){ // récupère TOUTES les zones de texte du débrief avant fermeture (anti-perte de saisie)
  const ev=curEvent(); if(!ev) return;
  document.querySelectorAll('.db-task').forEach(el=>{ const r=findTaskAnywhere(el.getAttribute('data-tid')); if(r) r.task.debrief=el.value; });
  const rep=$('db-report'); if(rep) ev.report=rep.value;
}

function sortByDate(arr){ return arr.map((x,i)=>[x,i]).sort((a,b)=>{ const da=a[0].date||'', db=b[0].date||''; if(da&&db){ if(da!==db) return da<db?-1:1; return a[1]-b[1]; } if(da&&!db) return -1; if(!da&&db) return 1; return a[1]-b[1]; }).map(p=>p[0]); }
function sortByDeps(arr){
  const ids=new Set(arr.map(t=>t.id));
  const placed=new Set(); const out=[]; const remaining=arr.slice(); let guard=0;
  while(remaining.length && guard++<10000){
    let progressed=false;
    for(let i=0;i<remaining.length;i++){
      const t=remaining[i];
      const deps=(t.dependsOn||[]).filter(d=>ids.has(d));
      if(deps.every(d=>placed.has(d))){ out.push(t); placed.add(t.id); remaining.splice(i,1); progressed=true; break; }
    }
    if(!progressed){ remaining.forEach(t=>{ out.push(t); placed.add(t.id); }); break; }
  }
  return out;
}

function subHTML(s,parent){
  const st=stOf(s.status);
  const extra=[];
  if(s.responsible)extra.push('👤 '+esc(s.responsible));
  if(s.duration)extra.push('⏱ '+fmtM(s.duration));
  if(s.budget&&s.budget.amount)extra.push(fmtE(s.budget.amount));
  let h=`<div class="sub">
    <div class="sub-check" style="border-color:${st.c};background:${s.status==='done'?st.c:'#fff'}" data-act="event.stopPropagation();toggleTask('${s.id}')">${s.status==='done'?'✓':((s.subtasks&&s.subtasks.length&&countAllDone(s.subtasks)>0)?`<span style="color:${st.c};font-size:11px;font-weight:800;line-height:1">–</span>`:'')}</div>
    <div class="sub-text ${s.status==='done'?'done':''}" data-act="openTask('${s.id}')">${esc(s.text)}${extra.length?` <span style="color:var(--ink-soft);font-size:11.5px">· ${extra.join(' · ')}</span>`:''}</div>
  </div>`;
  if(s.subtasks&&s.subtasks.length){ h+=`<div class="subs-deep">${s.subtasks.map(ss=>subHTML(ss,s)).join('')}</div>`; }
  return h;
}
