function _jCat(t){ const x=((t.text||'')+' '+((t.budget&&t.budget.theme)||'')).toLowerCase();
  if(t.budget&&t.budget.theme&&t.budget.theme!=='Divers')return t.budget.theme;
  if(/imprim|feuille|affiche|document|photocop/.test(x))return'Impression';
  if(/achet|bonbon|alcool|sandwich|nourrit|plateau|boisson|kidoush|g[âa]teau/.test(x))return'Nourriture & achats';
  if(/chaise|salle|soukka|sukkah|montage|d[ée]mont|nappe|drap|d[ée]cor/.test(x))return'Salle & décoration';
  if(/hazan|photograph|bahour|anim|b[ée]n[ée]vole|personnel|pourboire/.test(x))return'Personnel';
  if(/lien|publi|annonce|whatsapp|r[ée]serv|message|appel|t[ée]l[ée]phon/.test(x))return'Communication';
  return'Autres'; }
function _jScore(o){ const t=o.t; let s=0; if(t.priority==='haute')s+=1000; const x=(t.text||'').toLowerCase();
  if(o.eff&&o.eff<todayKey())s+=200;
  if(/r[ée]serv|autoris|command|confirm|location|salle|montage|atelier|terrain/.test(x))s+=100;
  if(/imprim|pr[ée]par|traduc/.test(x))s+=60; if(/achet|command/.test(x))s+=40;
  if(/jour j|matin|soir|annonc|servir|rang|nettoy|bilan|remerci/.test(x))s-=40;
  try{ s+=Math.min(totalDuration(t)||0,300)/10; }catch(e){}
  return s; }
function jSortGroups(open,mode){
  if(mode==='theme'){ const g={}; open.forEach(o=>{ const k=_jCat(o.t); (g[k]=g[k]||[]).push(o); }); return Object.entries(g).sort((a,b)=>b[1].length-a[1].length).map(([title,items])=>({title:'🗂️ '+title,items})); }
  if(mode==='where'){ const g={}; open.forEach(o=>{ const k=(o.where&&o.where.trim())||'Indépendante'; (g[k]=g[k]||[]).push(o); }); return Object.entries(g).sort((a,b)=>a[0]<b[0]?-1:1).map(([title,items])=>({title:'📍 '+title,items})); }
  const sorted=open.slice().sort((a,b)=>_jScore(b)-_jScore(a));
  const c1=sorted.filter(o=>_jScore(o)>=80), c2=sorted.filter(o=>{const s=_jScore(o);return s<80&&s>=20;}), c3=sorted.filter(o=>_jScore(o)<20);
  return [{title:'🔴 À faire en priorité',items:c1},{title:'🟡 Ensuite',items:c2},{title:'🟢 Quand tu peux',items:c3}].filter(g=>g.items.length); }

// ---------- toggle / move / delete ----------
function toggleTask(tid){
  const r=findTaskAnywhere(tid); if(!r)return;
  const t=r.task;
  if(t.subtasks && t.subtasks.length){
    // Case « générale » : coche tout / décoche tout selon l'état actuel.
    _setDone(t, !_leafAllDone(t));
  } else {
    // Cocher = Fait ; recocher = À faire. (« En cours » reste dispo dans l'éditeur.)
    t.status = (t.status==='done') ? 'todo' : 'done';
  }
  normalizeAllTasks();   // le parent devient « fait » quand toutes ses feuilles le sont
  save(); render();
}
function delTask(tid){
  const r=findTaskAnywhere(tid); if(!r)return;
  if(!confirm('Supprimer « '+r.task.text+' » ?'))return;
  const arr = r.loc.parent ? r.loc.parent.subtasks : containerTasks(r.loc);
  const i=arr.findIndex(x=>x.id===tid); if(i>=0)arr.splice(i,1);
  save(); render(); toast('Tâche supprimée');
}
function containerTasks(loc){
  if(loc.inbox||loc.ctx==='inbox'){ if(!Array.isArray(D.inbox))D.inbox=[]; return D.inbox; }
  if(loc.rdv||loc.ctx==='rdv'){ if(!Array.isArray(D.rdv))D.rdv=[]; return D.rdv; }
  if(loc.themeTask||loc.ctx==='theme'){ const th=themeById(loc.thId); if(th){ if(!Array.isArray(th.tasks))th.tasks=[]; return th.tasks; } return null; }
  if(loc.dossier||loc.ctx==='dossier'){ const d=dossierById(loc.doId); if(d){ if(!Array.isArray(d.items))d.items=[]; return d.items; } return null; }
  if(loc.contTask){ if(loc.pId){ const p=D.programs.find(x=>x.id===loc.pId); if(!p.tasks)p.tasks=[]; return p.tasks; } const m=D.months[loc.mId]; const f=m.fetes.find(x=>x.id===loc.fId); if(!f.tasks)f.tasks=[]; return f.tasks; }
  if(loc.ctx==='month'){ const m=D.months[loc.mId]; if(!m.tasks)m.tasks=[]; return m.tasks; }
  if(loc.ctx==='program'){ const p=D.programs.find(x=>x.id===loc.pId); const e=p.events.find(x=>x.id===loc.eId); return e.tasks; }
  const m=D.months[loc.mId]; const f=m.fetes.find(x=>x.id===loc.fId); const e=f.events.find(x=>x.id===loc.eId); return e.tasks;
}
function moveTask(tid,dir){
  const ev=curEvent(); if(!ev)return;
  const i=ev.tasks.findIndex(t=>t.id===tid); if(i<0)return;
  const j=i+dir; if(j<0||j>=ev.tasks.length)return;
  [ev.tasks[i],ev.tasks[j]]=[ev.tasks[j],ev.tasks[i]];
  save(); render();
}

let _renderingOverlay=false, _overlayDirty=false;
function renderOverlay(){
  // Anti-réentrance : remplacer innerHTML retire l'input focus → son onblur peut rappeler
  // renderOverlay en plein milieu (crash « node to be removed »). On diffère l'appel imbriqué.
  if(_renderingOverlay){ _overlayDirty=true; return; }
  _renderingOverlay=true;
  try{
    const r=$('overlay-root');
    const exSheet=r.querySelector('.sheet'); const exDrawer=r.querySelector('.drawer');
    const _ss=exSheet?exSheet.scrollTop:0;
    const hadSheet=!!exSheet, hadDrawer=!!exDrawer;
    let html='';
    if(drawerOpen) html+=drawerHTML();
    if(sheet) html+=sheetHTML();
    r.innerHTML=html;
    const _ns=r.querySelector('.sheet'); if(_ns){ if(hadSheet)_ns.classList.add('no-anim'); _ns.scrollTop=_ss; }
    const _nd=r.querySelector('.drawer'); if(_nd&&hadDrawer)_nd.classList.add('no-anim');
    if(typeof renderTimerPill==='function') renderTimerPill();
  } finally { _renderingOverlay=false; }
  if(_overlayDirty){ _overlayDirty=false; renderOverlay(); }
}
function closeSheet(){ sheet=null; editBuf=null; renderOverlay(); }

function toggleProgDates(){ progDates=!progDates; renderOverlay(); }
function parseDatesText(txt){
  const out=[]; const seen={};
  txt.split(/[\n,;\t]+/).map(s=>s.trim()).filter(Boolean).forEach(tok=>{
    let iso=null, m;
    if(m=tok.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)){ iso=m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0'); }
    else if(m=tok.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/)){ let y=m[3]; if(y.length===2)y='20'+y; iso=y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'); }
    if(iso && !seen[iso]){ seen[iso]=1; out.push(iso); }
  });
  return out;
}

const SH_MORNING=['Ouverture du Hékhal','1ʳᵉ montée','2ᵉ montée','3ᵉ montée','4ᵉ montée','5ᵉ montée','6ᵉ montée','7ᵉ montée','Maftir','Hagbaa'];
const SH_MINHA=['Ouverture du Hékhal','1ʳᵉ montée','2ᵉ montée','3ᵉ montée','Hagbaa'];
function shReco(poste){ if(poste==='1ʳᵉ montée')return 'cohen'; if(poste==='2ᵉ montée')return 'levi'; return null; }

function shSetParacha(v){ shWeek(shAnchor||nextShabbat()).paracha=v; save(); }
function shTogPresence(section,pid){ const w=shWeek(shAnchor||nextShabbat()); if(w.presence[section][pid])delete w.presence[section][pid]; else w.presence[section][pid]=true; save(); render(); }
function personName(id){ const p=(D.persons||[]).find(x=>x.id===id); return p?p.name:''; }
function shAddPerson(){ const n=prompt('Nom de la personne :'); if(!n||!n.trim())return; const tr=prompt('Cohen / Lévi / Israël ?','Israël')||''; const tribe=/coh/i.test(tr)?'cohen':(/lev|lév/i.test(tr)?'levi':'israel'); D.persons.push({id:uid(),name:n.trim(),tribe:tribe,hebBirth:'',yahrzeit:''}); save(); render(); }
function shAssign(block,poste,val){ const w=shWeek(shAnchor||nextShabbat());
  if(val==='__new'){ const n=prompt('Nom de la personne :'); if(!n||!n.trim()){render();return;} const tr=prompt('Cohen / Lévi / Israël ?','Israël')||''; const tribe=/coh/i.test(tr)?'cohen':(/lev|lév/i.test(tr)?'levi':'israel'); const p={id:uid(),name:n.trim(),tribe:tribe,hebBirth:'',yahrzeit:''}; D.persons.push(p); w.aliyot[block][poste]=p.id; }

  else { w.aliyot[block][poste]=val; }

function shAssignCount(){ const c={}; Object.values(D.shabbat||{}).forEach(w=>{ ['morning','minha'].forEach(b=>{ Object.values((w.aliyot&&w.aliyot[b])||{}).forEach(pid=>{ if(pid)c[pid]=(c[pid]||0)+1; }); }); }); return c; }
function shHebAnnivInRange(iso,startIso){ // vrai si l'anniversaire hébraïque tombe dans les 7 jours après startIso
  try{ const ev=hebParts(new Date(iso+'T12:00:00')); let d=new Date(startIso+'T12:00:00'); for(let i=1;i<=7;i++){ d.setDate(d.getDate()+1); const cp=hebParts(d); if(cp.day===ev.day && cp.month===ev.month) return true; } }catch(e){} return false; }
function shPriorBonus(p,key){ let b=0; if(p.hebBirth && shHebAnnivInRange(p.hebBirth,key))b++; if(p.yahrzeit && shHebAnnivInRange(p.yahrzeit,key))b++; return b; }
function shSuggest(){ const key=shAnchor||nextShabbat(); const w=shWeek(key); const counts=shAssignCount(); const used=new Set(); ['morning','minha'].forEach(b=>Object.values(w.aliyot[b]).forEach(id=>used.add(id)));
  const pick=(tribe)=>{ let cand=(D.persons||[]).filter(p=>!used.has(p.id) && (!tribe||p.tribe===tribe)); if(!cand.length)return null; cand.sort((a,b)=>{ const pa=shPriorBonus(a,key),pb=shPriorBonus(b,key); if(pa!==pb)return pb-pa; return (counts[a.id]||0)-(counts[b.id]||0); }); used.add(cand[0].id); return cand[0].id; };
  SH_MORNING.forEach(poste=>{ if(poste==='Ouverture du Hékhal'||poste==='Hagbaa'||poste==='Maftir')return; if(w.aliyot.morning[poste])return; const id=pick(shReco(poste)); if(id)w.aliyot.morning[poste]=id; });
  save(); render(); toast('Suggestions appliquées — tu peux tout modifier');

function shPlanningText(key){

  t+=`${civilDate(key)}\n🕎 ${hp.day} ${_mo?_mo.name:''} ${hp.year}\n${'─'.repeat(28)}\n\n📖 Chabbat matin\n`;

function shPosteOk(poste,tribe){ const r=shReco(poste); if(!r)return true; return r===tribe; }
function shAddRequest(){ const key=shAnchor||nextShabbat(); const w=shWeek(key); const persons=D.persons||[]; if(!persons.length){ toast('Ajoute d\'abord des personnes'); return; }

function shReqAccept(rid){ const w=shWeek(shAnchor||nextShabbat()); const r=(w.requests||[]).find(x=>x.id===rid); if(!r)return; const p=(D.persons||[]).find(x=>x.id===r.personId); let poste=r.pref;

function collectAllTasks(){ const out=[];
  Object.entries(D.months).forEach(([mId,m])=>{ const mm=MONTHS.find(x=>x.id===mId);
    (m.tasks||[]).forEach(t=>out.push({t,where:(mm?mm.name:'Mois')}));
    m.fetes.forEach(f=>{ (f.tasks||[]).forEach(t=>out.push({t,where:f.name})); f.events.forEach(e=>(e.tasks||[]).forEach(t=>out.push({t,where:f.name+' › '+e.name}))); });

function nextShabbat(fromIso){ const d=new Date((fromIso||todayKey())+'T12:00:00'); let add=(6 - d.getDay()+7)%7; d.setDate(d.getDate()+add); return todayKey(d); }
function annEventsFor(shabbatIso){
  const S=new Date(shabbatIso+'T12:00:00'); const out=[];
  const add=(e,where)=>{ const an=e.announce; if(!an||!an.on||!e.date)return; const E=new Date(e.date+'T12:00:00'); const days=(E-S)/86400000; const weeks=an.weeks||1; if(days>=-1 && days<=weeks*7+1){ out.push({e,where,days}); } };
  Object.entries(D.months).forEach(([mId,m])=>{ const mm=MONTHS.find(x=>x.id===mId); m.fetes.forEach(f=>f.events.forEach(e=>add(e,f.name))); });
  (D.programs||[]).filter(p=>!p._general).forEach(p=>p.events.forEach(e=>add(e,p.name)));
  out.sort((a,b)=>a.days-b.days);
  return out;
}
function annBuildText(shabbatIso){
  const items=annEventsFor(shabbatIso);
  let txt=`📢 ANNONCES — Chabbat ${civilDate(shabbatIso)}\n${'─'.repeat(30)}\n\n`;
  if(!items.length){ txt+='(Aucun événement à annoncer ce Chabbat. Active l\'annonce sur un événement daté.)\n'; return txt; }
  items.forEach(x=>{ const e=x.e; const an=e.announce||{};
    txt+=`• ${e.name}`;
    if(e.date) txt+=` — ${civilDate(e.date)} · 🕎 ${hebrewDate(e.date)}`;
    txt+='\n';
    if(e.public) txt+=`  Public : ${e.public}\n`;
    if(an.text) txt+=`  ${an.text}\n`;
    if(an.long){ const tot=e.tasks?e.tasks.length:0; txt+=`  (Programme détaillé disponible.)\n`; }
    txt+='\n';
  });
  txt+=`— Beth Habad · stepbystep`;
  return txt;
}

function _destTasksArray(dest){

function delEventInMonth(eid){ const md=D.months[nav.monthId]; if(!md)return; const mg=md.fetes.find(f=>f._monthGeneral); if(!mg)return; const e=(mg.events||[]).find(x=>x.id===eid); if(!e)return; if(!confirm('Supprimer l\'événement « '+e.name+' » ?'))return; mg.events=mg.events.filter(x=>x.id!==eid); save(); render(); toast('Événement supprimé'); }
function delCurrentEvent(){ if(!confirm('Supprimer cet événement et ses tâches ?'))return; const c=curContainer(); const e=curEvent(); if(!c||!e)return; c.events=c.events.filter(x=>x.id!==e.id); save(); if(nav.view==='themeEvent'){ leaveThemeEvent(); } else { go({eventId:null}); } toast('Événement supprimé'); }
function delCurrentContainer(){ const c=curContainer(); if(!c)return; if(!confirm('Supprimer définitivement « '+c.name+' » et tout son contenu ?'))return; if(nav.ctx==='program'){ D.programs=D.programs.filter(x=>x.id!==c.id); save(); setView('journal'); } else { const m=curMonth(); if(m)m.fetes=m.fetes.filter(x=>x.id!==c.id); save(); go({feteId:null,eventId:null}); } toast('Supprimé'); }
function listFeteDests(){ const out=[]; MONTHS.forEach(mm=>{ const mId=mm.id; const m=D.months[mId]; out.push({v:'month|'+mId,label:mm.emoji+' '+mm.name+' › 📌 Événements (hors fête)'}); if(m){ m.fetes.filter(f=>!f._monthGeneral).forEach(f=>out.push({v:'fete|'+mId+'|'+f.id,label:mm.name+' › '+f.name})); } }); D.programs.forEach(p=>out.push({v:'program|'+p.id,label:'📚 '+p.name})); return out; }
function destContainer(v){ const pr=v.split('|'); if(pr[0]==='program'){ return D.programs.find(x=>x.id===pr[1]); } if(pr[0]==='month'){ return monthFete(pr[1]); } const m=D.months[pr[1]]; return m?m.fetes.find(x=>x.id===pr[2]):null; }
function cloneEventNewIds(ev){ const c=JSON.parse(JSON.stringify(ev)); c.id=uid(); const reid=(t)=>{ t.id=uid(); t.dependsOn=[]; (t.subtasks||[]).forEach(reid); }; (c.tasks||[]).forEach(reid); return c; }
function evMoveTo(v){ if(!v)return; const ev=curEvent(); const cont=curContainer(); const tgt=destContainer(v); if(!ev||!cont||!tgt){toast('Destination introuvable');return;} const fromTheme=(nav.view==='themeEvent'); const i=cont.events.findIndex(e=>e.id===ev.id); if(i<0)return; const moved=cont.events.splice(i,1)[0]; if(fromTheme && !moved.themeId) moved.themeId=nav.themeId; tgt.events.push(moved); save(); if(fromTheme){ leaveThemeEvent(); } else { go({eventId:null}); } toast('Événement déplacé ✓'); }
function evDupTo(v){ if(!v)return; const ev=curEvent(); const tgt=destContainer(v); if(!ev||!tgt){toast('Destination introuvable');return;} tgt.events.push(cloneEventNewIds(ev)); save(); toast('Événement dupliqué ✓'); render(); }
function navDrawer(v){ drawerOpen=false; setView(v); }

// Tap sur le fond : si l'explorateur de rattachement est ouvert (ou le calendrier),
// on le referme et on RESTE sur la tâche au lieu de tout fermer.
function sheetBackdrop(){
  if(sheet && sheet.type==='task' && moveNav){ mvClose(); return; }
  if(sheet && sheet.type==='quickTask'){ quickTaskCancel(); return; }
  if(sheet && sheet.type==='datepick'){ dpClose(); return; }
  if(sheet && sheet.type==='timer'){ tmrClose(); return; }
  if(sheet && sheet.type==='debrief'){ dbClose(); return; }   // enregistre le débrief au lieu de perdre la saisie
  closeSheet();
}

// ============================================================
//  SHEET : ÉDITION DE TÂCHE (complet — tâches ET sous-tâches)
// ============================================================
function openTask(tid){
  const r=findTaskAnywhere(tid); if(!r)return;
  editBuf=JSON.parse(JSON.stringify(r.task));
  editBuf._loc=r.loc; editBuf._isSub=!!r.loc.parent; editBuf._parentId=r.loc.parent?r.loc.parent.id:null;
  moveNav=null;
  sheet={type:'task'}; renderOverlay();
}
// Ajout rapide façon Google Tasks : juste l'intitulé, puis « Plus d'options » déplie l'éditeur complet.
function openQuickTask(tid){
  const r=findTaskAnywhere(tid); if(!r)return;
  editBuf=JSON.parse(JSON.stringify(r.task));
  editBuf._loc=r.loc; editBuf._isSub=!!r.loc.parent; editBuf._parentId=r.loc.parent?r.loc.parent.id:null;
  editBuf._new=true; moveNav=null;
  sheet={type:'quickTask'}; renderOverlay();
  setTimeout(()=>{ const e=$('qt-text'); if(e){ e.focus(); } },60);
}
function quickTaskSheet(){
  const t=editBuf; const prio=t.priority==='haute';
  return `<div class="sheet-head"><div class="sheet-title">Nouvelle tâche</div><button class="sheet-close" data-act="quickTaskCancel()">✕</button></div>
  <div class="sheet-body">
    <input class="input" id="qt-text" value="${esc(t.text||'')}" placeholder="Qu'y a-t-il à faire ?" style="font-size:16px" onkeydown="if(event.key==='Enter'){event.preventDefault();quickTaskSave();}">
    <div style="display:flex;align-items:center;gap:8px;margin-top:12px">
      <button class="qt-ic" data-act="quickTaskMore()" title="Toutes les options (fiche complète)">☰</button>
      <button class="qt-ic ${t.date?'on':''}" id="qt-date" data-act="quickTaskSync();openDatePicker('task')" title="Choisir une date / heure / répétition">🗓</button>
      <button class="qt-ic ${prio?'on':''}" id="qt-star" data-act="quickTaskTogglePrio()" title="Prioritaire">${prio?'⭐':'☆'}</button>
      ${t.date?`<span style="font-size:12.5px;color:var(--primary);font-weight:600">${fmtDate(t.date)}${t.time?' · '+t.time:''}${t.repeat?' · '+repeatLabel(t.repeat):''}</span>`:''}
    </div>
    <button class="btn btn-primary btn-block" style="margin-top:14px" data-act="quickTaskSave()">Ajouter</button>
  </div>`;
}
function quickTaskTogglePrio(){ quickTaskSync(); editBuf.priority=(editBuf.priority==='haute')?'normale':'haute'; const prio=editBuf.priority==='haute'; const b=$('qt-star'); if(b){ b.classList.toggle('on',prio); b.textContent=prio?'⭐':'☆'; } else { renderOverlay(); } }
function quickTaskSync(){ const el=$('qt-text'); if(el) editBuf.text=el.value; }
function quickTaskSave(){ quickTaskSync(); saveTask(true); closeSheet(); render(); toast('Tâche ajoutée ✓'); }
function quickTaskMore(){ quickTaskSync(); sheet={type:'task'}; renderOverlay(); }
function quickTaskCancel(){ quickTaskSync(); if(!editBuf.text||!editBuf.text.trim()){ try{ const loc=editBuf._loc; const arr=(loc&&loc.parent)?loc.parent.subtasks:containerTasks(loc); const i=arr.findIndex(x=>x.id===editBuf.id); if(i>=0)arr.splice(i,1); save(); }catch(e){} } else { saveTask(true); } closeSheet(); render(); }

function parseDur(s){ if(s==null)return 0; s=String(s).toLowerCase().trim(); if(!s)return 0; const hm=s.match(/(\d+)\s*h\s*(\d+)/); if(hm)return parseInt(hm[1])*60+parseInt(hm[2]); const h=s.match(/(\d+)\s*h/); const mn=s.match(/(\d+)\s*(?:min|m)\b/); if(h||mn){ return (h?parseInt(h[1])*60:0)+(mn?parseInt(mn[1]):0); } const n=parseInt(s); return isNaN(n)?0:n; }

// localiser l'event d'une loc
function eventOfLoc(loc){
  if(!loc)return null;
  if(loc.ctx==='themeEvent'){ const th=themeById(loc.thId); return th?(th.events||[]).find(e=>e.id===loc.eId):null; }
  if(loc.ctx==='program'){ const p=D.programs.find(x=>x.id===loc.pId); return p?p.events.find(e=>e.id===loc.eId):null; }
  const m=D.months[loc.mId]; if(!m)return null; const f=m.fetes.find(x=>x.id===loc.fId); return f?f.events.find(e=>e.id===loc.eId):null;
}
// Conversion d'un nombre en lettres hébraïques (guématria) avec géresh/guershayim. Ex. 14→י״ד, 786→תשפ״ו
function _gem(n){ n=parseInt(n)||0; if(n<=0)return ''+n;
  const ones=['','א','ב','ג','ד','ה','ו','ז','ח','ט'], tens=['','י','כ','ל','מ','נ','ס','ע','פ','צ'];
  let s='', hun=Math.floor(n/100); while(hun>=4){ s+='ת'; hun-=4; } s+=['','ק','ר','ש'][hun]||''; let r=n%100;
  if(r===15) s+='טו'; else if(r===16) s+='טז'; else { s+=tens[Math.floor(r/10)]; s+=ones[r%10]; }
  if(s.length>1) s=s.slice(0,-1)+'״'+s.slice(-1); else if(s.length===1) s=s+'׳';
  return s; }
function hebrewDate(iso){ if(!iso) return ''; try{ const d=new Date(iso+'T12:00:00'); const mid=hebMonthIdOf(iso); const mo=MONTHS.find(x=>x.id===mid);
  const parts=new Intl.DateTimeFormat('en-u-ca-hebrew',{day:'numeric',year:'numeric'}).formatToParts(d); let day='',year=''; parts.forEach(p=>{if(p.type==='day')day=p.value;if(p.type==='year')year=p.value;});
  if(lang==='he'){ // date entièrement en hébreu (guématria) : י״ד אלול תשפ״ו
    const moHeb=mo?(mo.heb||mo.name):new Intl.DateTimeFormat('he-u-ca-hebrew',{month:'long'}).format(d);
    return _gem(day)+' '+moHeb+' '+_gem(parseInt(year)%1000);
  }
  const moName=mo?mo.name:new Intl.DateTimeFormat('en-u-ca-hebrew',{month:'long'}).format(d); return day+' '+moName+' '+year; }catch(e){ return ''; } }
function civilDate(iso){ if(!iso) return ''; try{ return new Date(iso+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }catch(e){ return iso; } }
function feteOfLoc(loc){ if(!loc||loc.ctx==='program') return null; const m=D.months[loc.mId]; if(!m) return null; return m.fetes.find(x=>x.id===loc.fId)||null; }
function effectiveDate(task,loc){ if(task&&task.date) return task.date; const ev=eventOfLoc(loc); if(ev&&ev.date) return ev.date; const f=feteOfLoc(loc); if(f&&f.date) return f.date; if(loc&&loc.ctx==='program'){ const p=D.programs.find(x=>x.id===loc.pId); if(p&&p.date) return p.date; } return ''; }
function parentLabel(loc){ if(!loc) return ''; if(loc.ctx==='themeEvent'){ const th=themeById(loc.thId); const ev=eventOfLoc(loc); return (th?((th.icon||'🎯')+' '+th.name):'Thème')+(ev?' › '+ev.name:''); } if(loc.dossier||loc.ctx==='dossier'){ const d=dossierById(loc.doId); return d?('🗂️ '+d.name):'Dossier'; } if(loc.rdv||loc.ctx==='rdv') return '📅 Rendez-vous'; if(loc.themeTask||loc.ctx==='theme'){ const th=themeById(loc.thId); return th?((th.icon||'🎯')+' '+th.name):'Thème'; } if(loc.inbox||loc.ctx==='inbox') return '📥 Indépendante'; if(loc.ctx==='program'){ const p=D.programs.find(x=>x.id===loc.pId); const ev=eventOfLoc(loc); return (p?p.name:'')+(ev?' › '+ev.name:''); } const m=MONTHS.find(x=>x.id===loc.mId); const f=feteOfLoc(loc); const ev=eventOfLoc(loc); return (m?m.emoji+' '+m.name:'')+(f?' › '+f.name:'')+(ev?' › '+ev.name:''); }

function saveTask(silent){
  syncInputs();
  if(editBuf && editBuf._tplItem!=null){
    const idx=editBuf._tplItem; const clean=JSON.parse(JSON.stringify(editBuf)); delete clean._tplItem; delete clean._loc; delete clean._isSub; delete clean._parentId;
    if(tplBuf && idx<tplBuf.items.length) tplBuf.items[idx]=clean;
    if(!silent){ sheet={type:'templateEdit'}; renderOverlay(); }
    return;
  }
  const r=findTaskAnywhere(editBuf.id); if(!r){ if(!silent)closeSheet(); return; }
  // réécrire les champs (sans les _meta transitoires)
  const clean={...editBuf}; Object.keys(clean).forEach(k=>{ if(k[0]==='_') delete clean[k]; });
  Object.keys(clean).forEach(k=>{ r.task[k]=clean[k]; });
  // retirer d'éventuels flags transitoires déjà persistés
  ['_showWho','_showBudget','_showMat','_showDeps','_showRec','_moreOpen','_moveOpen','_expOpen','_new'].forEach(k=>{ delete r.task[k]; });
  // mémoriser nouveaux responsables/magasins
  if(clean.responsible && !D.people.includes(clean.responsible)) D.people.push(clean.responsible);
  if(clean.budget&&clean.budget.theme && !THEMES.includes(clean.budget.theme)){ if(!D.budgetThemes)D.budgetThemes=[]; if(!D.budgetThemes.includes(clean.budget.theme))D.budgetThemes.push(clean.budget.theme); }
  if(clean.material&&clean.material.store && !D.stores.includes(clean.material.store)) D.stores.push(clean.material.store);
  save();
  if(!silent){ closeSheet(); render(); }
}

function genSessions(pid){
  const p=D.programs.find(x=>x.id===pid);
  const from=$('gen-from')&&$('gen-from').value, to=$('gen-to')&&$('gen-to').value;
  if(!from||!to){ toast('Choisis les dates de début et de fin'); return; }
  const wds=[]; for(let i=0;i<7;i++){ const c=$('gen-wd-'+i); if(c&&c.checked) wds.push((i+1)%7); }
  const existing=new Set(p.sessions.map(s=>sessIso(s)));
  let d=new Date(from+'T12:00:00'); const end=new Date(to+'T12:00:00'); let added=0;
  while(d<=end && added<400){
    const iso=todayKey(d); const dow=d.getDay();
    if((wds.length===0 || wds.includes(dow)) && !existing.has(iso)){ p.sessions.push({id:uid(),iso:iso}); existing.add(iso); added++; }
    d.setDate(d.getDate()+1);
  }
  progYM=from.slice(0,7); progGen=false; save(); renderOverlay(); toast(added+' journée(s) créée(s)');
}

function openSmartSort(){ sheet={type:'smartsort'}; renderOverlay(); }
function smartSortSheet(){
  return `<div class="sheet-head"><div class="sheet-title">✨ Tri intelligent</div><button class="sheet-close" data-act="closeSheet()">✕</button></div>
  <div class="sheet-body">
    <button class="btn btn-primary btn-block" style="margin-bottom:10px" data-act="applySort('theme')">🗂️ Par thème — regroupé par catégorie</button>
    <button class="btn btn-gold btn-block" data-act="applySort('priority')">⏱️ Par priorité</button>
  </div>`;
}
function applySort(mode){
  const ev=curEvent(); if(!ev){closeSheet();return;}
  const tasks=ev.tasks.slice();
  if(mode==='theme'){
    const themeOf=t=>{
      const x=(t.text+' '+(t.budget&&t.budget.theme||'')).toLowerCase();
      if(t.budget&&t.budget.theme&&t.budget.theme!=='Divers')return t.budget.theme;
      if(/imprim|feuille|affiche|document|photocop/.test(x))return'Impression';
      if(/achet|bonbon|alcool|sandwich|nourrit|plateau|boisson|kidoush|gâteau/.test(x))return'Nourriture & achats';
      if(/chaise|salle|sukkah|montage|démont|nappe|drap|décor/.test(x))return'Salle & décoration';
      if(/hazan|photograph|bahour|anim|bénévole|personnel|pourboire/.test(x))return'Personnel';
      if(/lien|publi|annonce|whatsapp|réserv|message/.test(x))return'Communication';
      return'Autres';
    };
    const groups={};
    tasks.forEach(t=>{const k=themeOf(t);(groups[k]=groups[k]||[]).push(t);});
    groupedView={mode:'theme',groups:Object.entries(groups).map(([title,items])=>({title,items}))};
  } else {
    // priorité : score selon mots-clés d'anticipation + dépendances + durée
    const score=t=>{
      const x=t.text.toLowerCase(); let s=0;
      if(/réserv|autoris|command|confirm|location|salle|montage|atelier|terrain/.test(x))s+=100; // à anticiper
      if(/imprim|feuille|prépar|traduc/.test(x))s+=60;
      if(/achet|command/.test(x))s+=40;
      if(/jour j|matin|soir|annonc|servir|rang|nettoy|bilan|remerci/.test(x))s-=40; // proche de l'événement
      s+=(t.dependsOn&&t.dependsOn.length?-20:0);
      s+=Math.min(totalDuration(t),300)/10;
      return s;
    };
    const sorted=tasks.slice().sort((a,b)=>score(b)-score(a));
    const cut1=sorted.filter(t=>score(t)>=80), cut2=sorted.filter(t=>score(t)<80&&score(t)>=20), cut3=sorted.filter(t=>score(t)<20);
    groupedView={mode:'priority',groups:[
      {title:'🔴 À anticiper en priorité',items:cut1},
      {title:'🟡 À préparer ensuite',items:cut2},
      {title:'🟢 Dernière ligne droite',items:cut3},
    ].filter(g=>g.items.length)};
  }
  closeSheet(); render();
}

function jRange(){
  const tk=todayKey(); const anchor=jDay||tk; const base=new Date(anchor+'T12:00:00');
  const LC=_jLocale();
  if(jPeriod==='week'){ const d=new Date(base); const off=(d.getDay()+6)%7; d.setDate(d.getDate()-off); const from=todayKey(d); const e=new Date(d); e.setDate(e.getDate()+6); const to=todayKey(e); return {from,to,label:t('Sem. du ','שבוע ','Wk of ')+new Date(from+'T12:00:00').toLocaleDateString(LC,{day:'numeric',month:'short'})}; }
  if(jPeriod==='civil'){ const f=new Date(base.getFullYear(),base.getMonth(),1); const tt=new Date(base.getFullYear(),base.getMonth()+1,0); return {from:todayKey(f),to:todayKey(tt),label:base.toLocaleDateString(LC,{month:'long',year:'numeric'})}; }
  if(jPeriod==='heb'){ const mid=hebMonthIdOf(anchor); let from=anchor,to=anchor; for(let i=1;i<=45;i++){ const d=new Date(base); d.setDate(d.getDate()-i); const k=todayKey(d); if(hebMonthIdOf(k)===mid)from=k; else break; } for(let i=1;i<=45;i++){ const d=new Date(base); d.setDate(d.getDate()+i); const k=todayKey(d); if(hebMonthIdOf(k)===mid)to=k; else break; } const mo=MONTHS.find(x=>x.id===mid); return {from,to,label:(mo?mo.emoji+' '+mName(mo):t('Mois héb.','חודש עברי','Heb. month'))}; }
  return {from:anchor,to:anchor,label: anchor===tk?t("Aujourd'hui",'היום','Today'):new Date(anchor+'T12:00:00').toLocaleDateString(LC,{weekday:'short',day:'numeric',month:'short'})};
}
function setJPeriod(p){ jPeriod=p; jDay=todayKey(); openDD=null; render(); }
function jNav(dir){ const base=new Date((jDay||todayKey())+'T12:00:00');

// ── FUSION thèmes → dossiers : une seule notion. Déterministe + idempotente (rejoue sans dupliquer). ──
function migrateThemesToDossiers(){
  if(!Array.isArray(D.themes) || !D.themes.length){ D._themesMerged=true; return; }
  if(!D._themesMerged){ try{ snapshotBackup('avant fusion thèmes→dossiers',true); }catch(e){} }
  if(!Array.isArray(D.dossiers)) D.dossiers=[];
  const norm=s=>String(s||'').trim().toLowerCase();
  const map={};   // themeId -> dossierId
  D.themes.forEach(th=>{
    let d = D.dossiers.find(x=>!x.parentId && norm(x.name)!=='' && norm(x.name)===norm(th.name));  // fusion par nom
    if(!d) d = D.dossiers.find(x=>x.id===th.id);
    if(!d){ d = mkDossier(th.name||''); d.id=th.id; D.dossiers.push(d); }
    map[th.id]=d.id;
    if(!d.color && th.color && th.color!=='#1E3A6E') d.color=th.color;
    if((!d.icon||d.icon==='🗂️') && th.icon && th.icon!=='🎯') d.icon=th.icon;
    (th.tasks||[]).forEach(t=>{ if(!d.items.some(it=>it.id===t.id)) d.items.push(t); });
    (th.events||[]).forEach(ev=>{ if(d.items.some(it=>it.id===ev.id)) return; d.items.push({id:ev.id,kind:'title',text:ev.name||'Activité',level:1}); (ev.tasks||[]).forEach(t=>{ if(!d.items.some(it=>it.id===t.id)) d.items.push(t); }); });
  });
  const retag=e=>{ const src=e.dossierId||e.themeId; if(src){ const did=map[src]||(D.dossiers.some(x=>x.id===src)?src:null); if(did) e.dossierId=did; } if('themeId' in e) delete e.themeId; };
  Object.values(D.months||{}).forEach(m=>(m.fetes||[]).forEach(f=>(f.events||[]).forEach(retag)));
  (D.programs||[]).forEach(p=>(p.events||[]).forEach(retag));
  (D.dossiers||[]).forEach(d=>{ if(d.anchor && d.anchor.kind==='theme'){ const pid=map[d.anchor.id]; if(pid && pid!==d.id) d.parentId=pid; d.anchor=null; } });
  D.themes=[];
  D._themesMerged=true;
}

function dossierEvents(dId){ const out=[]; Object.entries(D.months||{}).forEach(([mId,m])=>(m.fetes||[]).forEach(f=>(f.events||[]).forEach(e=>{ if((e.dossierId||e.themeId)===dId) out.push({e,mId,fId:f.id}); }))); (D.programs||[]).forEach(p=>(p.events||[]).forEach(e=>{ if((e.dossierId||e.themeId)===dId) out.push({e,pId:p.id,isProgram:true}); })); return out; }

// Tri des dossiers : A→Z par défaut ; si l'utilisateur a réordonné manuellement (champ .ord), on respecte cet ordre.
function _sortDoss(list){ const hasOrd=list.some(d=>typeof d.ord==='number'); if(hasOrd){ return list.slice().sort((a,b)=>((a.ord==null?1e9:a.ord)-(b.ord==null?1e9:b.ord))||(a.name||'').localeCompare(b.name||'','fr',{sensitivity:'base'})); } return list.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||'','fr',{sensitivity:'base'})); }
function commitDossOrder(ids){ if(!Array.isArray(ids)||!ids.length)return; ids.forEach((id,i)=>{ const d=dossierById(id); if(d) d.ord=i; }); save(); render(); toast('Ordre enregistré ✓'); }
function dossiersFor(kind,id){ return _sortDoss((D.dossiers||[]).filter(d=>!d.parentId && d.anchor && d.anchor.kind===kind && d.anchor.id===id)); }
function dossiersStandalone(){ return _sortDoss((D.dossiers||[]).filter(d=>!d.parentId && !d.anchor)); }
function dossierChildren(id){ return _sortDoss((D.dossiers||[]).filter(d=>d.parentId===id)); }
function dossDescendantIds(id){ const out=new Set([id]); let added=true; while(added){ added=false; (D.dossiers||[]).forEach(d=>{ if(d.parentId && out.has(d.parentId) && !out.has(d.id)){ out.add(d.id); added=true; } }); } return out; }

  if(others.length){ h+=`<div class="section-label" style="margin-top:8px">Dans un autre dossier</div>`; others.forEach(x=>{ h+=`<div class="mvdest"><div class="mvdest-name">🗂️ ${esc(x.name||'Dossier sans nom')}</div><div class="mvdest-acts"><button class="btn btn-primary btn-sm" data-act="dossMoveTo('${x.id}')">Ici</button></div></div>`; }); }
  else h+=`<div class="hint">Aucun autre dossier disponible.</div>`;
  h+=`</div>`; return h; }

function _dossNextTitle(items,from,maxLevel){ for(let j=from;j<items.length;j++){ if(items[j].kind==='title' && (items[j].level||1)<=maxLevel) return j; } return items.length; }
function dossAddTitle(){ const d=dossierById(nav.dossierId); if(!d)return; const it=mkTitle('',1); d.items.push(it); dossEditId=it.id; save(); render(); _dossFocusTitle(it.id); }
function dossAddSubtitle(titleId){ const d=dossierById(nav.dossierId); if(!d)return; dossExpand(titleId); const ti=d.items.findIndex(x=>x.id===titleId); if(ti<0)return; const plvl=(d.items[ti].level||1); const j=_dossNextTitle(d.items,ti+1,plvl); const it=mkTitle('',plvl+1); dossOpen[it.id]=true; dossEditId=it.id; d.items.splice(j,0,it); save(); render(); _dossFocusTitle(it.id); }
// bloc d'un titre = le titre + tout ce qui est en dessous jusqu'au prochain titre de niveau <= le sien
function _dossBlock(items,i){ const lvl=items[i].level||1; let e=i+1; while(e<items.length && !(items[e].kind==='title' && (items[e].level||1)<=lvl)) e++; return {start:i,end:e,lvl}; }
function dossMoveTitle(id,dir){ const d=dossierById(nav.dossierId); if(!d)return; const items=d.items; const i=items.findIndex(x=>x.id===id); if(i<0)return; const blk=_dossBlock(items,i); const lvl=blk.lvl; const block=items.slice(blk.start,blk.end);
  if(dir<0){ let p=blk.start-1; while(p>=0 && !(items[p].kind==='title' && (items[p].level||1)<=lvl)) p--; if(p<0 || (items[p].level||1)!==lvl){ toast('Déjà en haut de sa section'); return; } items.splice(blk.start,block.length); items.splice(p,0,...block); }
  else { if(blk.end>=items.length || !(items[blk.end].kind==='title' && (items[blk.end].level||1)===lvl)){ toast('Déjà en bas de sa section'); return; } const nb=_dossBlock(items,blk.end); const len=block.length; items.splice(blk.start,len); items.splice(nb.end-len,0,...block); }
  save(); render(); }
function dossTitleToTask(id){ const d=dossierById(nav.dossierId); if(!d)return; const i=d.items.findIndex(x=>x.id===id); if(i<0)return; const it=d.items[i]; const t=mkTask(it.text||''); d.items.splice(i,1,t); delete dossOpen[id]; if(dossEditId===id)dossEditId=null; save(); render(); toast('Titre transformé en tâche ✓'); }

function dossTaskToTitle(){ const id=editBuf&&editBuf.id; const loc=editBuf&&editBuf._loc; if(!id||!loc||loc.ctx!=='dossier'){ toast('Uniquement pour une tâche de dossier'); return; } const d=dossierById(loc.doId); if(!d)return; const i=d.items.findIndex(x=>x.id===id); if(i<0)return; syncInputs(); const txt=(editBuf.text||'').trim(); const it=mkTitle(txt,1); d.items.splice(i,1,it); dossOpen[it.id]=true; save(); closeSheet(); render(); toast('Tâche transformée en titre ✓'); }

function dossPickImage(titleId){ const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.onchange=e=>{ const f=e.target.files&&e.target.files[0]; if(f)_dossReadImage(f,titleId); }; inp.click(); }
function _dossReadImage(f,titleId){ const rd=new FileReader(); rd.onload=()=>{ const img=new Image(); img.onload=()=>{ const max=1280; let w=img.width,h=img.height; if(w>max||h>max){ if(w>h){ h=Math.round(h*max/w); w=max; } else { w=Math.round(w*max/h); h=max; } } let data; try{ const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h); data=cv.toDataURL('image/jpeg',0.7); }catch(e){ data=rd.result; } if(data.length>2.2*1024*1024){ toast('Image trop lourde même compressée'); return; } _dossInsertMedia({mtype:'image',data:data,name:f.name},titleId); }; img.onerror=()=>toast('Image illisible'); img.src=rd.result; }; rd.readAsDataURL(f); }

function validateReport(key){
  const j=ensureJournal(key);
  if(!j.validated){
    // Validation : la saisie du jour est « engrangée » (archived) et le compteur visible repart à zéro.
    // Le Bilan additionne archived + counters, donc rien n'est perdu.
    j.archived=j.archived||{};
    COUNTERS.forEach(c=>{ j.archived[c.k]=(j.archived[c.k]||0)+(j.counters[c.k]||0); j.counters[c.k]=0; });
    j.validated=true;
  } else {
    // Modifier : on ré-injecte le cumul validé dans la saisie pour pouvoir corriger.
    COUNTERS.forEach(c=>{ j.counters[c.k]=(j.counters[c.k]||0)+((j.archived&&j.archived[c.k])||0); if(j.archived)j.archived[c.k]=0; });
    j.validated=false;
  }
  save(); render();
}

function bumpCounter(key,k,d){ const j=ensureJournal(key); j.counters[k]=Math.max(0,(j.counters[k]||0)+d); save(); render(); }

let customFrom='', customTo='';
function setDashRange(v){ dashRange=v; render(); }
function computeRange(mode){
  const now=new Date(); let from,to,label;
  if(mode==='today'){ from=to=todayKey(now); label='Aujourd\'hui'; }
  else if(mode==='week'){ const d=new Date(now); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); from=todayKey(d); to=todayKey(now); label='Cette semaine'; }
  else if(mode==='month'){ const d=new Date(now.getFullYear(),now.getMonth(),1); from=todayKey(d); to=todayKey(now); label='Ce mois-ci'; }
  else { from=customFrom||todayKey(now); to=customTo||todayKey(now); label='Du '+fmtDate(from)+' au '+fmtDate(to); }
  const totals={}; COUNTERS.forEach(c=>totals[c.k]=0); const notes=[]; let days=0;
  Object.entries(D.journal).forEach(([k,j])=>{
    if(k>=from&&k<=to){ let any=false; COUNTERS.forEach(c=>{const v=(j.counters[c.k]||0)+((j.archived&&j.archived[c.k])||0);totals[c.k]+=v;if(v)any=true;}); if(j.note){notes.push({date:fmtDate(k),note:j.note,key:k});any=true;} if(any)days++; }
  });
  notes.sort((a,b)=>a.date<b.date?1:-1);
  // compteurs de tâches (missions) sur la plage
  let taskTotal=0, taskDone=0;
  datedAll().forEach(x=>{ if(x.kind==='reminder'||x.kind==='rdv'||!x.t)return; const iso=x.iso; if(iso&&iso>=from&&iso<=to){ taskTotal++; if(x.t.status==='done') taskDone++; } });
  return {from,to,label,totals,notes,days,taskTotal,taskDone};
}
function fmtDate(k){ try{return new Date(k).toLocaleDateString(_jLocale(),{day:'numeric',month:'short'});}catch(e){return k;} }

function setShopRange(v){ shopRange=v; render(); }
function renderShopping(c){
  const today=new Date(); today.setHours(0,0,0,0);
  const limitDays = shopRange==='all'? null : parseInt(shopRange);
  const within=(iso)=>{ if(limitDays===null) return true; if(!iso) return false; const d=new Date(iso+'T12:00:00'); const days=Math.floor((d-today)/86400000); return days>=0 && days<=limitDays; };
  // rassembler le matériel "à acheter" non fait, avec échéance héritée (tâche → événement → fête)
  const byStore={};
  const collect=(arr,where,effDate)=>{ (arr||[]).forEach(t=>{
    const m=t.material;
    const tDate=t.date||effDate||'';
    if(m&&m.type==='buy'&&t.status!=='done'){
      const lines=(m.lines&&m.lines.length)?m.lines:null;
      if(lines){
        if(within(tDate)) lines.forEach(ln=>{ if(ln.product||ln.store||ln.qty){ const store=ln.store||'Sans magasin'; (byStore[store]=byStore[store]||[]).push({t,where,date:tDate,line:ln}); } });
      } else if(m.note||/achet/i.test(t.text)){
        if(within(tDate)){ (byStore['Sans magasin']=byStore['Sans magasin']||[]).push({t,where,date:tDate,line:null}); }
      }
    }
    if(t.subtasks)collect(t.subtasks,where,tDate);
  }); };
  Object.values(D.months).forEach(m=>m.fetes.forEach(f=>f.events.forEach(e=>collect(e.tasks,f.name,e.date||f.date||''))));
  D.programs.forEach(p=>p.events.forEach(e=>collect(e.tasks,p.name,e.date||p.date||'')));

  let html=`<div class="sec"><div><div class="sec-eyebrow">${t("Ce qu'il reste à acheter",'מה שנותר לקנות','What\'s left to buy')}</div><div class="sec-title">${t('Liste de courses','רשימת קניות','Shopping List')}</div></div></div>`;
  const ranges=[['all','Tout'],['30','30 jours'],['14','14 jours'],['7','7 jours']];
  html+=`<div class="filters">${ranges.map(([v,l])=>`<button class="chip ${shopRange===v?'active':''}" data-act="setShopRange('${v}')">${l}</button>`).join('')}</div>`;
  const stores=Object.keys(byStore);
  if(!stores.length){
    html+= shopRange==='all'
      ? emptyHTML('🛒','Rien à acheter','Marque des tâches en « 🛒 À acheter » avec un magasin pour les voir regroupées ici.','','')
      : emptyHTML('🛒','Rien sur cette période','Aucun achat daté dans cette fenêtre. Pense à dater les fêtes/événements concernés.','','');
  } else {
    html+=`<div class="hint">${shopRange==='all'?'Tous les achats, regroupés par magasin.':'À acheter dans les '+shopRange+' prochains jours, par magasin.'}</div>`;
    stores.sort().forEach(store=>{
      const items=byStore[store];
      html+=`<div class="shop-store"><div class="shop-store-head"><div class="shop-store-name">🏪 ${esc(store)}</div><span class="shop-store-count">${items.length}</span></div>`;
      items.forEach(({t,where,date,line})=>{
        const m=t.material;
        const ech = date? ' · 📅 '+fmtDate(date) : '';
        const nm = (line&&(line.product||line.qty)) ? ((line.qty?esc(line.qty)+' ':'')+esc(line.product||'')) : esc(t.text);
        const ctx = (line&&line.product) ? ' · '+esc(t.text) : '';
        html+=`<div class="shop-item">
          <div class="check" style="width:22px;height:22px;border-color:var(--line)" data-act="toggleTask('${t.id}')"></div>
          <div class="shop-item-main" data-act="openTask('${t.id}')">
            <div class="shop-item-name">${nm}</div>
            <div class="shop-item-meta">${esc(where)}${ctx}${m.note?' · '+esc(m.note):''}${t.budget&&t.budget.amount?' · '+fmtE(t.budget.amount):''}${ech}</div>
          </div>
        </div>`;
      });
      html+=`</div>`;
    });
  }
  c.innerHTML=html;
}

function expGather(scope){
  if(scope==='task' && editBuf){ const rows=[]; _pushTaskRow(rows,editBuf,0); return {title:editBuf.text||'Tache', rows}; }
  if(scope==='event'){ const e=curEvent(); if(e){ const rows=[{lvl:0,type:'Événement',nom:e.name||'',statut:'',resp:'',date:e.date||'',duree:'',budget:'',note:''}]; (e.tasks||[]).forEach(t=>_pushTaskRow(rows,t,1)); return {title:e.name,rows}; } }
  if(scope==='fete'||scope==='program'){ const c=curContainer(); if(c) return {title:c.name, rows:_rowsContainer(c, scope==='program'?'Programme':'Fête')}; }
  const rows=[];
  Object.entries(D.months).forEach(([mId,m])=>{ const mm=MONTHS.find(x=>x.id===mId); if((m.fetes&&m.fetes.length)||(m.tasks&&m.tasks.length)){ rows.push({lvl:0,type:'Mois',nom:(mm?mm.name:mId),statut:'',resp:'',date:'',duree:'',budget:'',note:''}); (m.fetes||[]).forEach(f=>_rowsContainer(f,'Fête').forEach(r=>{r.lvl+=1;rows.push(r);})); (m.tasks||[]).forEach(t=>_pushTaskRow(rows,t,1)); } });
  (D.programs||[]).filter(p=>!p._general).forEach(p=>_rowsContainer(p,'Programme').forEach(r=>rows.push(r)));
  if(Array.isArray(D.inbox)&&D.inbox.length){ rows.push({lvl:0,type:'Indépendantes',nom:'📥 Boîte de réception',statut:'',resp:'',date:'',duree:'',budget:'',note:''}); D.inbox.forEach(t=>_pushTaskRow(rows,t,1)); }

}

function expCsv(scope){ const g=expGather(scope); const head=['Niveau','Type','Nom','Statut','Responsable','Date','Durée','Budget','Note']; const lines=[head.join(';')]; g.rows.forEach(r=>lines.push([r.lvl,r.type,r.nom,r.statut,r.resp,r.date,r.duree,r.budget,r.note].map(_cell).join(';'))); dlFile(_slug(g.title)+'.csv','text/csv;charset=utf-8','﻿'+lines.join('\r\n')); toast('Excel (CSV) téléchargé'); }
function expTxt(scope){ const g=expGather(scope); const lines=g.rows.map(r=>{ const ind='   '.repeat(r.lvl); let s=ind+'• '+r.nom; const meta=[]; if(r.statut)meta.push(r.statut); if(r.resp)meta.push('👤 '+r.resp); if(r.date)meta.push('📅 '+r.date); if(r.duree)meta.push('⏱ '+r.duree); if(r.budget)meta.push(r.budget+' €'); if(meta.length)s+='  ('+meta.join(' · ')+')'; if(r.note)s+='\n'+ind+'    ↳ '+r.note; return s; }); dlFile(_slug(g.title)+'.txt','text/plain;charset=utf-8',g.title+'\n'+'='.repeat(g.title.length)+'\n\n'+lines.join('\n')); toast('Texte téléchargé'); }

function expImportFile(){ const inp=document.createElement('input'); inp.type='file'; inp.accept='.txt,.csv,.json'; inp.onchange=e=>{ const f=e.target.files[0]; if(!f)return; const rd=new FileReader(); rd.onload=()=>{ const txt=String(rd.result||''); if(f.name.toLowerCase().endsWith('.json')){ if(!confirm('Remplacer TOUTES les données par cette sauvegarde ?'))return; try{ D=JSON.parse(txt); save(); closeSheet(); render(); toast('Sauvegarde importée ✓'); }catch(err){ toast('JSON invalide'); } return; } const ev=_importTarget(); if(!ev){ toast('Ouvre une fête ou un événement pour importer'); return; } let count=0; txt.split(/\r?\n/).forEach((line,i)=>{ line=line.trim(); if(!line)return; let name=line; if(line.indexOf(';')>=0){ if(i===0&&/niveau|type|nom/i.test(line))return; const cols=line.split(';').map(c=>c.replace(/^﻿/,'').replace(/^"|"$/g,'').trim()); name=cols[2]||cols[1]||cols[0]||''; } name=name.replace(/^[•\-\*\s]+/,'').trim(); if(!name)return; ev.tasks.push(mkTask(name)); count++; }); save(); closeSheet(); render(); toast(count+' tâche(s) importée(s) ✓'); }; rd.readAsText(f); }; inp.click(); }

let _gcalTimer=null;
function _gcal(){ if(!D.gcal||typeof D.gcal!=='object') D.gcal={url:'',secret:'',auto:true,lastSync:''}; if(!D.gcal.secret) D.gcal.secret=_randSecret(); return D.gcal; }
function _randSecret(){ var s='',c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; for(var i=0;i<18;i++){ s+=c.charAt(Math.floor(Math.random()*c.length)); } return s; }
// Développe une tâche répétée en occurrences concrètes dans [fromIso, toIso].
// Approche volontairement côté client : Google reçoit des dates fermes (robuste,
// pas de dépendance aux séries récurrentes de l'API Agenda).
function expandOccurrences(startIso, rep, fromIso, toIso, cap){
  cap=cap||366; const out=[]; if(!startIso||!rep||!rep.freq) return out;
  const start=new Date(startIso+'T12:00:00');
  const from=new Date(fromIso+'T12:00:00'), to=new Date(toIso+'T12:00:00');
  const iv=Math.max(1, parseInt(rep.interval)||1);
  const endCount = rep.endType==='after' ? Math.max(1, parseInt(rep.count)||1) : Infinity;
  const endDate = (rep.endType==='on' && rep.endDate) ? new Date(rep.endDate+'T12:00:00') : null;
  let produced=0, guard=0;
  if(rep.freq==='week'){

  if(Array.isArray(D.programs) && D.programs.length){
    const real=D.programs.filter(p=>!p._general);
    if(real.length){ if(!Array.isArray(D._archivedPrograms))D._archivedPrograms=[]; real.forEach(p=>{ if(!D._archivedPrograms.some(x=>x.id===p.id)) D._archivedPrograms.push(JSON.parse(JSON.stringify(p))); }); }
    drainTasks(D.programs);
    D.programs=[];
  }
  if(D.byYear) Object.values(D.byYear).forEach(y=>{
    if(Array.isArray(y.programs) && y.programs.length){
      const real=y.programs.filter(p=>!p._general);
      if(real.length){ if(!Array.isArray(D._archivedPrograms))D._archivedPrograms=[]; real.forEach(p=>{ if(!D._archivedPrograms.some(x=>x.id===p.id)) D._archivedPrograms.push(JSON.parse(JSON.stringify(p))); }); }
      drainTasks(y.programs);
      y.programs=[];
    }
  });
  // dédoublonnage (D.programs et byYear[activeYear].programs partagent souvent le même tableau)
  const seen={}; D.inbox=D.inbox.filter(t=>{ if(!t||!t.id) return true; if(seen[t.id]) return false; seen[t.id]=1; return true; });
}
// Applique les valeurs par défaut / migrations sur D (après chargement local OU cloud).
function ensureCollections(){
  if(!D._activeYear) D._activeYear=D.year;
  if(!D.journal) D.journal={};
  if(!D.stores) D.stores=['Carrefour','Amazon'];
  if(!D.eventTemplates) D.eventTemplates=[];
  if(!D._v12cleared){ D.months={}; D.programs=[]; D._v12cleared=true; }
  if(!Array.isArray(D.themes)) D.themes=[];
  D.themes.forEach(th=>{ if(!Array.isArray(th.events)) th.events=[]; if(!Array.isArray(th.tasks)) th.tasks=[]; });
  if(!D.bdd||!Array.isArray(D.bdd.cats)) D.bdd={cats:[]};
  if(!D.menuHidden||typeof D.menuHidden!=='object') D.menuHidden={};
  migrateMaterials();
  if(!Array.isArray(D.inbox)) D.inbox=[];
  if(!Array.isArray(D.rdv)) D.rdv=[];
  if(!Array.isArray(D.dossiers)) D.dossiers=[];
  D.dossiers.forEach(d=>{ if(!d.icon)d.icon='🗂️'; if(!('color' in d))d.color=null; });
  migrateThemesToDossiers();   // fusion : les thèmes deviennent des dossiers (une seule notion)
  migratePrograms();     // retire la fonctionnalité Programmes, range les tâches libres dans D.inbox
  normalizeAllTasks();   // cohérence parent/sous-tâches (le parent = fait ssi toutes ses feuilles le sont)
  syncCounters();
  if(!Array.isArray(D.publics)) D.publics=['Tout public','Hommes','Femmes','Enfants','Jeunes','Familles','Étudiants'];
  if(!D.tsedaka) D.tsedaka={done:{},hour:'09:00',days:[0,1,2,3,4,5,6]};
  if(!Array.isArray(D.ideas)) D.ideas=[];
  if(!Array.isArray(D.persons)) D.persons=[];
  if(!D.shabbat) D.shabbat={};
  lang=D._lang||'fr'; document.documentElement.lang=lang; document.documentElement.dir=(lang==='he'?'rtl':'ltr');
}
// Données d'avant le multi-compte (à migrer une seule fois dans la 1re association créée).
function _legacyData(){ try{ const s=localStorage.getItem('marbitz-v11'); if(s){ const o=JSON.parse(s); if(_isRealD(o)) return o; } }catch(e){} return null; }
function _migrated(){ try{ return localStorage.getItem('sbs_legacy_migrated')==='1'; }catch(e){ return false; } }
function _setMigrated(){ try{ localStorage.setItem('sbs_legacy_migrated','1'); }catch(e){} }

// Entrée dans l'app une fois l'association choisie.
function enterApp(){
  try{ localStorage.setItem('sbs_org',_org.id); }catch(e){}
  _isAdmin = !!_org.is_admin || (_orgs[0]&&!!_orgs[0].is_admin);
  const hadLocal=load();
  _freshEntry=!hadLocal;
  if(!hadLocal){
    // Pas encore de cache local pour cette association.
    const legacy=_legacyData();
    if(legacy && !_migrated()){ D=legacy; _setMigrated(); }   // migration des anciennes données (Beth Habad)
    else { D=freshData(); D._activeYear=D.year; }              // nouvelle association : monde vierge
  }
  ensureCollections();
  _cloudSuppress=true; save(); _cloudSuppress=false;   // écrit le cache local (sans pousser : _cloudReady est encore faux)
  _gateBusy=false;
  render();
  try{ cloudStart(); }catch(e){}
}

// Après connexion : charger les associations et choisir la bonne.
async function bootAuthed(){
  renderGate('loading');
  try{
    if(!await _ensureToken()){ _auth=null; _authSave(); renderGate('login','Session expirée, reconnecte-toi.'); return; }
    await loadOrgs();
    let want=null; try{ want=localStorage.getItem('sbs_org'); }catch(e){}
    _org = _orgs.find(o=>o.id===want) || (_orgs.length===1?_orgs[0]:null);
    if(!_orgs.length){ renderGate('org-new'); return; }
    if(!_org){ renderGate('org-pick'); return; }
    enterApp();
  }catch(e){
    if(/not_authenticated|JWT|token/i.test(e.message||'')){ _auth=null; _authSave(); renderGate('login','Reconnecte-toi.'); }
    else renderGate(_orgs.length?'org-pick':'org-new', 'Réessaie : '+(e.message||'erreur'));
  }
}

function boot(){
  try{
    _authLoad();
    lang='fr'; document.documentElement.lang='fr'; document.documentElement.dir='ltr';
    if(!_auth){ renderGate('login'); return; }
    bootAuthed();
  }catch(err){
    document.getElementById('app').innerHTML='<div style="padding:40px;font-family:sans-serif;color:#1C2A3A">'+
      '<h2 style="font-family:Georgia,serif">stepbystep</h2>'+
      '<p style="color:#B23B3B">Une erreur est survenue au démarrage.</p>'+
      '<pre style="background:#F7F4ED;padding:12px;border-radius:8px;overflow:auto;font-size:12px">'+esc(err&&err.message||err)+'</pre>'+
      '<button data-act="try{localStorage.removeItem(\'marbitz-v11\')}catch(e){};location.reload()" style="margin-top:12px;padding:10px 16px;background:#1E3A6E;color:#fff;border:none;border-radius:8px">Réinitialiser et recharger</button></div>';
    console.error(err);
  }
}
// Empêche le navigateur d'afficher automatiquement le bandeau « Installer l'application » (répétitif).
try{ window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); }); }catch(e){}

// Bouton RETOUR du téléphone : recule DANS l'app (ferme la fiche / remonte d'un niveau) au lieu de quitter.
function handleBack(){
  try{
    if(openDD){ openDD=null; render(); return; }
    if(datePicker){ dpClose(); return; }
    if(sheet && sheet.type==='task' && moveNav){ mvClose(); return; }
    if(sheet && sheet.type==='quickTask'){ quickTaskCancel(); return; }
    if(sheet && sheet.type==='timer'){ tmrClose(); return; }
    if(sheet){ closeSheet(); return; }
    if(drawerOpen){ toggleDrawer(false); return; }
    if(nav.view==='dossier'){ dossierBack(); return; }
    if(nav.view==='themeEvent'){ leaveThemeEvent(); return; }
    if(nav.view==='themes' && themeNav){ themeNav=null; render(); return; }
    if(nav.view==='bdd' && bddNav){ if(bddNav.sub){ bddNav={cat:bddNav.cat}; } else { bddNav=null; } render(); return; }
    if(nav.eventId){ go({eventId:null}); return; }
    if(nav.feteId){ go({feteId:null}); return; }
    if(nav.monthId){ go({monthId:null}); return; }
    if(nav.view!=='journal'){ setView('journal'); return; }
    // À la racine (Ma Journée) : on reste dans l'app, on ne quitte pas.
  }catch(e){}
}
try{
  history.pushState(null,''); // amorce une entrée d'historique
  window.addEventListener('popstate', function(){ handleBack(); history.pushState(null,''); }); // re-amorce → le retour ne quitte jamais
}catch(e){}

// ── Clavier mobile : garder le champ en cours de saisie visible AU-DESSUS du clavier ──
(function(){
  let _kbT=null;
  function bringIntoView(el){ if(!el||!el.closest)return; if(!el.closest('.sheet'))return; try{ el.scrollIntoView({block:'center',behavior:'smooth'}); }catch(e){ try{ el.scrollIntoView(); }catch(_){} } }
  function isField(el){ return el && el.matches && el.matches('input,textarea,select') && el.closest && el.closest('.sheet'); }
  document.addEventListener('focusin', function(e){ const el=e.target; if(!isField(el))return; clearTimeout(_kbT); _kbT=setTimeout(()=>bringIntoView(el), 300); });
  if(window.visualViewport){ window.visualViewport.addEventListener('resize', function(){ const el=document.activeElement; if(isField(el)){ clearTimeout(_kbT); _kbT=setTimeout(()=>bringIntoView(el), 60); } }); }
})();

// ── Réordonner les dossiers : appui long (~0,5 s) puis glisser, comme sur un téléphone ──
(function(){
  const LONG=500, MOVE_CANCEL=12;
  let press=null, drag=null;
  const grp=el=>(el&&el.getAttribute)?el.getAttribute('data-dossgroup'):null;
  const itemsIn=g=>[...document.querySelectorAll('.doss-item[data-dossgroup="'+g+'"]')];
  function endPress(){ if(press){ document.removeEventListener('touchmove',press.onMove); clearTimeout(press.timer); press=null; } }
  function endDrag(commit){ if(!drag)return; const g=drag.group; drag.el.classList.remove('doss-dragging'); drag=null;
    if(commit){ const order=itemsIn(g).map(n=>n.getAttribute('data-dossid'));
      const eat=(ev)=>{ ev.stopPropagation(); ev.preventDefault(); document.removeEventListener('click',eat,true); };
      document.addEventListener('click',eat,true); setTimeout(()=>document.removeEventListener('click',eat,true),450);
      if(typeof commitDossOrder==='function') commitDossOrder(order);
    } }
  document.addEventListener('touchstart', function(e){
    if(drag) return; const el=e.target.closest && e.target.closest('.doss-item'); if(!el) return;
    const t=e.touches[0]; const sx=t.clientX, sy=t.clientY; endPress();
    const onMove=(ev)=>{ const tt=ev.touches[0]; if(!tt)return; if(Math.abs(tt.clientX-sx)>MOVE_CANCEL||Math.abs(tt.clientY-sy)>MOVE_CANCEL) endPress(); };
    document.addEventListener('touchmove',onMove,{passive:true});
    press={ el, onMove, timer:setTimeout(()=>{ document.removeEventListener('touchmove',onMove); press=null; drag={el,group:grp(el)}; el.classList.add('doss-dragging'); try{ if(navigator.vibrate) navigator.vibrate(15); }catch(_){} }, LONG) };
  }, {passive:true});
  document.addEventListener('touchmove', function(e){
    if(!drag) return; e.preventDefault(); const t=e.touches[0]; if(!t)return;
    const under=document.elementFromPoint(t.clientX,t.clientY);
    const tgt=under && under.closest && under.closest('.doss-item');
    if(tgt && tgt!==drag.el && grp(tgt)===drag.group){ const r=tgt.getBoundingClientRect(); const before=(t.clientY < r.top + r.height/2); tgt.parentNode.insertBefore(drag.el, before?tgt:tgt.nextSibling); }
  }, {passive:false});
  document.addEventListener('touchend', function(){ endPress(); endDrag(true); }, {passive:true});
  document.addEventListener('touchcancel', function(){ endPress(); endDrag(false); }, {passive:true});
})();

// ============================================================
//  Tirer vers le bas pour recharger (pull-to-refresh)
//  Le corps est en overflow:hidden ; le défilement se fait dans #main,
//  donc le geste natif du navigateur n'est jamais déclenché. On le
//  reproduit : à partir du HAUT de la liste, tirer vers le bas recharge.
// ============================================================
function installPullToRefresh(){
  if(window._ptrInstalled) return; window._ptrInstalled=true;
  const ind=document.createElement('div');
  ind.id='ptr-ind';
  ind.style.cssText='position:fixed;top:0;left:50%;transform:translate(-50%,-52px);width:40px;height:40px;border-radius:50%;background:var(--surface,#fff);box-shadow:0 4px 16px rgba(0,0,0,.20);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--primary,#1E3A6E);z-index:400;opacity:0;pointer-events:none;font-weight:700';
  ind.textContent='↓';
  const mount=()=>{ if(document.body && !ind.isConnected) document.body.appendChild(ind); };
  mount();
  let startY=0, pulling=false, ready=false, refreshing=false;
  const mainEl=()=>document.getElementById('main');
  const blocked=()=>refreshing || document.querySelector('.overlay,.sheet,.drawer,.dd-menu,.dd-scrim');
  document.addEventListener('touchstart',function(e){
    if(refreshing || e.touches.length!==1){ pulling=false; return; }
    const m=mainEl();
    if(m && m.scrollTop<=0 && !blocked()){ startY=e.touches[0].clientY; pulling=true; ready=false; mount(); }
    else pulling=false;
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(!pulling) return;
    const m=mainEl(); if(!m){ pulling=false; return; }
    const dy=e.touches[0].clientY - startY;
    if(dy>0 && m.scrollTop<=0){
      e.preventDefault();
      const dist=Math.min(dy*0.5,80);
      ready=dist>=58;
      ind.style.transition='transform .04s linear';
      ind.style.opacity='1';
      ind.style.transform='translate(-50%,'+(dist-16)+'px) rotate('+(ready?180:0)+'deg)';
      ind.textContent= ready ? '↑' : '↓';
    } else if(dy<-4){
      pulling=false;
      ind.style.transition='opacity .18s,transform .2s'; ind.style.opacity='0'; ind.style.transform='translate(-50%,-52px)';
    }
  },{passive:false});
  const end=function(){
    if(!pulling) return; pulling=false;
    if(ready){
      refreshing=true; ind.textContent='⟳';
      ind.style.transition='transform .18s'; ind.style.transform='translate(-50%,22px)'; ind.style.opacity='1';
      setTimeout(function(){ try{ location.reload(); }catch(e){ try{ location.href=location.href; }catch(_){} } }, 180);
    } else {
      ind.style.transition='opacity .2s,transform .25s'; ind.style.opacity='0'; ind.style.transform='translate(-50%,-52px)';
    }
  };
  document.addEventListener('touchend',end,{passive:true});
  document.addEventListener('touchcancel',end,{passive:true});
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
else boot();
try{ installPullToRefresh(); }catch(e){}

// ---------- DÉTECTION DE NOUVELLE VERSION (fin des soucis de cache) ----------
// L'appli compare sa version à celle publiée ; si elles diffèrent, elle propose de recharger.
const APP_BUILD=((document.querySelector('meta[name="app-build"]')||{}).content)||'';
let _updShown=false, _updLast=0;
function _showUpdateBanner(){
  if(_updShown||document.getElementById('upd-banner'))return; _updShown=true;
  const d=document.createElement('div'); d.id='upd-banner';
  d.style.cssText='position:fixed;left:12px;right:12px;bottom:78px;z-index:99999;background:#1E3A6E;color:#fff;padding:12px 14px;border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.28);display:flex;align-items:center;gap:10px;font-size:14px;font-family:inherit';
  d.innerHTML='<span style="flex:1">🔄 Nouvelle version disponible</span><button style="background:#fff;color:#1E3A6E;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer" onclick="try{location.reload()}catch(e){location.href=location.pathname}">Recharger</button>';
  document.body.appendChild(d);
}
async function checkForUpdate(){
  try{
    const now=Date.now(); if(now-_updLast<90*1000) return; _updLast=now;
    const html=await fetch('/?u='+now,{cache:'no-store'}).then(r=>r.text());
    const m=html.match(/name="app-build" content="([^"]+)"/);
    if(m && m[1] && APP_BUILD && m[1]!==APP_BUILD) _showUpdateBanner();
  }catch(e){}
}
setTimeout(checkForUpdate, 4000);
setInterval(checkForUpdate, 10*60*1000);
try{ document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') checkForUpdate(); }); }catch(e){}

// PWA : enregistre le service worker s'il est présent (met l'app à jour toute seule quand elle est en ligne).
// PWA : service worker « réseau d'abord » → l'app récupère toujours la dernière version quand elle est en ligne,
// et fonctionne hors-ligne avec la dernière connue. Mise à jour automatique à chaque ouverture connectée.
try{ if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').then(function(reg){ try{ reg.update(); }catch(e){} setInterval(function(){ try{ reg.update(); }catch(e){} }, 60*60*1000); }).catch(function(){}); }); } }catch(e){}
// Stockage rendu PERMANENT : le navigateur ne pourra pas effacer tes données automatiquement.
try{ if(navigator.storage && navigator.storage.persist){ navigator.storage.persist(); } }catch(e){}
